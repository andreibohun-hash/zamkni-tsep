/* Палитра — одно место (PROTO-BASE §9). Мастерская электрика: тёмная стена, синяя панель на деревянной раме, медь и латунь.
   3D-фон рисует шейдер теми же цветами (VIEW.BG_*). */
:root{
  --bg:#1b1f2a; --ink:#ffffff; --ink2:#23283a; --muted:#c9d2e6;
  --panel:#3d6fb0; --panel2:#244a80; --accent:#ffcf3a; --accent-ink:#4a2a00; --danger:#ff4d4d; --ok:#ffd76a; --card:#fbfaf5;
  --frame-w:440px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 "Nunito", system-ui, sans-serif;font-weight:700;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:linear-gradient(#3a4256,#20242f);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top);z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none}
header .title{display:flex;flex-direction:column;align-items:center;text-shadow:0 2px 0 rgba(0,0,0,.35)}
header .title b{font-size:20px;font-weight:900;letter-spacing:.2px} header .title span{font-size:13px;color:var(--muted)}
header button{pointer-events:auto}
.ico{width:44px;height:44px;border-radius:14px;border:0;background:var(--panel);box-shadow:0 4px 0 var(--panel2);display:grid;place-items:center;cursor:pointer;padding:0}
.ico svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ico.off .wave{display:none} .ico:not(.off) .slash{display:none}
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 66px);z-index:2;text-align:center;font-size:15px;color:#fff;padding:0 24px;pointer-events:none;
  text-shadow:0 2px 0 rgba(0,0,0,.4)}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .35s}
#game canvas.ready{opacity:1}
footer{position:relative;z-index:3;display:flex;gap:10px;justify-content:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(20,24,34,0),rgba(20,24,34,.55))}
footer button{flex:1;max-width:120px;height:56px;border:0;border-radius:16px;background:var(--panel);box-shadow:0 5px 0 var(--panel2);color:#fff;font:inherit;font-weight:800;font-size:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
footer button svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
footer button:disabled{opacity:.5}
footer button.pulse{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 #d79c00;animation:pulse 1s ease-in-out infinite}
footer button.pulse svg{stroke:var(--accent-ink)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
button:active{transform:translateY(2px)}
/* Плашки на месте (не попап): замыкание — красная, победа — тёплая. */
.banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 64px);z-index:4;display:none;background:rgba(255,255,255,.96);color:var(--ink2);border-radius:18px;
  padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:15px;line-height:1.3;gap:10px;align-items:center}
.banner.show{display:flex}
.banner b{display:block;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
#dead b{color:var(--danger)}
/* Победа — внизу, под пальцем: крупно, звёзды, большая «Дальше». Стартует с видимого состояния (§9). */
#won{top:auto;bottom:calc(env(safe-area-inset-bottom) + 90px);flex-direction:column;align-items:stretch;gap:8px;padding:14px 16px 16px;border-radius:24px;
  background:linear-gradient(#fffaf0,#fff1c9);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 3px #ffcf3a inset;animation:wonIn .35s cubic-bezier(.2,1.4,.4,1)}
#won .row{display:flex;align-items:center;gap:12px}
#won b{color:#b86e00;font-size:28px;font-weight:1000;letter-spacing:.3px;text-transform:none}
#won .stars{display:flex;gap:4px;margin-left:auto} #won .stars svg{width:30px;height:30px}
#won .stars .off{opacity:.25}
#won #won-text{color:#5a4a2a;font-size:15px}
#won button{width:100%;font-size:22px;padding:14px 16px;border-radius:16px}
@keyframes wonIn{from{transform:translateY(16px) scale(.97)}to{transform:none}}
#dead .zap{flex:none;width:34px;height:34px} #won .zap{flex:none;width:34px;height:34px}
.banner button{flex:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:900;padding:10px 12px;box-shadow:0 4px 0 #d79c00;cursor:pointer}
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(10,14,24,.55);padding:20px}
#overlay.show{display:flex}
.card{background:var(--card);color:var(--ink2);border-radius:26px;padding:24px 20px;max-width:350px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.45);
  animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}  /* стартует с видимого состояния (§9) */
.card h1.logo{margin:0 0 6px;font-size:40px;line-height:1.05;font-weight:1000;color:#fff;-webkit-text-stroke:2px #244a80;text-shadow:0 4px 0 #244a80}
.card h1.logo i{font-style:normal;color:var(--accent)}
.card h2{margin:0 0 8px;font-size:30px;font-weight:1000} .card p{color:#59607a;margin:0 0 16px;font-weight:700}
.card button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:12px 16px;background:#e3e9f6;color:var(--ink2);cursor:pointer;margin:4px}
.card button.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #d79c00}
.card button.big{font-size:20px;padding:14px 22px;width:100%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.levels .lv{margin:0;padding:12px 0;font-size:18px}
.levels .lv.done{background:#fff0b8;color:#8a5a00} .levels .lv.cur{outline:3px solid var(--panel)}
.rules{text-align:left;padding-left:18px;margin:0 0 14px;color:#3a405a;font-weight:700} .rules li{margin:6px 0}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:4;background:rgba(20,24,40,.9);color:#fff;padding:9px 16px;border-radius:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s;max-width:86%;text-align:center;font-size:15px}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ #won{animation:none} .card{animation:none} #toast{transition:none} footer button.pulse{animation:none} }
</style>

// Панель электрика: на винтах висят стеклянные подковы (дуга 270°, разрыв 90°), внутри — медная жила.

  // по дорожке − к стыку C–E) → замок с F снят → D и E возвращаются, ток идёт большим кольцом через все три. par записан (проверяет sim).

// ---- геометрия ----
function gNorm(g){ return ((g % CFG.POS) + CFG.POS) % CFG.POS; }
function tipsOf(g){ g = gNorm(g); return [(g + 7) & 7, (g + 1) & 7]; }     // концы подковы: направления g−1 и g+1
function dirVec(k){ const a = k * Math.PI / 4; return { x: Math.sin(a), y: Math.cos(a) }; }
function ringCenter(r){ return { x: r.c * CFG.STEP, y: r.r * CFG.STEP }; }
function tipPos(r, k){ const c = ringCenter(r), d = dirVec(k); return { x: c.x + CFG.R * d.x, y: c.y + CFG.R * d.y }; }
function circDist(a, b){ const d = gNorm(b - a); return Math.min(d, CFG.POS - d); }

// ---- сборка уровня в граф точек (кэш на уровень) ----
const COMPILED = new WeakMap();
function compile(L){
  let C = COMPILED.get(L); if (C) return C;
  const pts = [], key = new Map();
  const ptAt = (x, y) => {
    const k = Math.round(x / CFG.EPS) + ',' + Math.round(y / CFG.EPS);
    if (key.has(k)) return key.get(k);
    pts.push({ x, y, tips: [], pad: -1, node: null, pins: [] }); key.set(k, pts.length - 1); return pts.length - 1;
  };
  const rid = new Map(L.rings.map((r, i) => [r.id, i]));
  const tipPt = L.rings.map((r, ri) => DIR.map((d, k) => { const p = tipPos(r, k), i = ptAt(p.x, p.y); pts[i].tips.push({ ri, k }); return i; }));
  const nodeIx = new Map();
  for (const nd of (L.nodes || [])){ const i = ptAt(nd.x, nd.y); pts[i].node = nd.id; nodeIx.set(nd.id, i); }
  const padIx = new Map(), padPts = [];
  (L.pads || []).forEach((pd, pi) => { padIx.set(pd.id, pi); padPts.push([]); });
  const errs = [];
  const tipRef = (ref) => {
    const m = /^([A-Za-z0-9]+)\.(NE|NW|SE|SW|N|E|S|W)$/.exec(ref || '');
    if (!m || !rid.has(m[1])) return -1;
    return tipPt[rid.get(m[1])][DIR.indexOf(m[2])];
  };
  (L.pads || []).forEach((pd, pi) => {
    for (const t of pd.tips){ const i = tipRef(t); if (i < 0){ errs.push('пятачок ' + pd.id + ': нет точки ' + t); continue; } padPts[pi].push(i); pts[i].pad = pi; }
  });
  const resolve = (ref, who) => {
    if (padIx.has(ref)) return padPts[padIx.get(ref)][0];
    if (nodeIx.has(ref)) return nodeIx.get(ref);
    const i = tipRef(ref); if (i < 0) errs.push(who + ': нет точки ' + ref);
    return i;
  };
  const base = new Int16Array(pts.length); for (let i = 0; i < pts.length; i++) base[i] = i;
  const find0 = (p, i) => { while (p[i] !== i){ p[i] = p[p[i]]; i = p[i]; } return i; };
  for (const pp of padPts) for (let k = 1; k < pp.length; k++){ const a = find0(base, pp[0]), b = find0(base, pp[k]); if (a !== b) base[a] = b; }
  const P = resolve(L.bat.p, 'батарейка +'), M = resolve(L.bat.m, 'батарейка −');
  if (P >= 0) pts[P].pins.push({ comp: 'bat', pin: 'p' }); if (M >= 0) pts[M].pins.push({ comp: 'bat', pin: 'm' });
  const lamps = L.lamps.map((lp, li) => { const a = resolve(lp.a, 'лампочка ' + lp.id), b = resolve(lp.b, 'лампочка ' + lp.id);
    if (a >= 0) pts[a].pins.push({ comp: li, pin: 'a' }); if (b >= 0) pts[b].pins.push({ comp: li, pin: 'b' }); return { a, b }; });
  const lockLamp = L.rings.map(() => -1);
  for (const lk of (L.locks || [])){ const ri = rid.get(lk.ring), li = L.lamps.findIndex(x => x.id === lk.lamp);
    if (ri === undefined || li < 0) errs.push('замок ' + lk.ring + '/' + lk.lamp + ': нет подковы или лампочки'); else lockLamp[ri] = li; }
  C = { L, pts, tipPt, padPts, base, P, M, lamps, lockLamp, errs, n: L.rings.length, par: new Int16Array(pts.length), rid };
  COMPILED.set(L, C); return C;
}
function find(p, i){ while (p[i] !== i){ p[i] = p[p[i]]; i = p[i]; } return i; }
function unite(p, a, b){ a = find(p, a); b = find(p, b); if (a !== b) p[a] = b; }

// ---- цепь: короткое замыкание, шунт, какие лампочки горят ----
// kind: 'short' (+ и − в одном узле), 'shunt' (под током лампочка закорочена), 'win' (горят все), 'open' (иначе; lit — что горит).
function evalCircuit(C, g, out){
  const p = C.par; p.set(C.base);
  for (let ri = 0; ri < C.n; ri++){ const t = tipsOf(g[ri]); unite(p, C.tipPt[ri][t[0]], C.tipPt[ri][t[1]]); }
  const r = out || {}; r.kind = 'open'; r.lit = 0; r.shunt = -1; r.live = null;
  const P = find(p, C.P), M = find(p, C.M);
  if (P === M){ r.kind = 'short'; return r; }
  const nl = C.lamps.length, U = new Int16Array(nl), V = new Int16Array(nl);
  for (let i = 0; i < nl; i++){ U[i] = find(p, C.lamps[i].a); V[i] = find(p, C.lamps[i].b); }
  // все простые пути P → M по лампочкам (лампочек ≤ 4 — перебор мгновенный)
  const live = new Set(), stack = [P];
  const dfs = (node, used) => {
    if (node === M){ r.lit |= used; for (const x of stack) live.add(x); return; }
    for (let i = 0; i < nl; i++){
      if (used & (1 << i) || U[i] === V[i]) continue;
      const nx = U[i] === node ? V[i] : V[i] === node ? U[i] : -1;
      if (nx < 0 || stack.includes(nx)) continue;
      stack.push(nx); dfs(nx, used | (1 << i)); stack.pop();
    }
  };
  dfs(P, 0);
  for (let i = 0; i < nl; i++) if (U[i] === V[i] && live.has(U[i])){ r.kind = 'shunt'; r.shunt = i; return r; }
  r.live = live;
  if (r.lit === (1 << nl) - 1) r.kind = 'win';
  return r;
}
function isFailKind(k){ return k === 'short' || k === 'shunt'; }

// ---- состояние ----
function createState(li, def){
  const L = def || LEVELS[li], C = compile(L);
  const s = { li, L, C, g: L.rings.map(r => gNorm(r.g || 0)), unl: 0, moves: 0, hist: [], ev: [], res: null };
  s.res = evalCircuit(C, s.g); s.unl = unlockFrom(C, s.res, 0);
  return s;
}
function unlockFrom(C, res, unl){ if (isFailKind(res.kind)) return unl; for (let ri = 0; ri < C.n; ri++){ const li = C.lockLamp[ri]; if (li >= 0 && (res.lit & (1 << li))) unl |= 1 << ri; } return unl; }
function cloneState(s){ return { li: s.li, L: s.L, C: s.C, g: s.g.slice(), unl: s.unl, moves: s.moves, hist: s.hist.slice(), ev: [], res: s.res }; }
function stateKey(s){ return s.g.join('') + '|' + s.unl; }
function ringLocked(s, ri){ return s.C.lockLamp[ri] >= 0 && !(s.unl & (1 << ri)); }
function isWin(s){ return s.res.kind === 'win'; }
function isFail(s){ return isFailKind(s.res.kind); }
function isLose(s){ return isFail(s); }

// ---- ход ----
function moveOf(ri, dir){ return ri * 2 + (dir > 0 ? 0 : 1); }
function legalMoves(s){ if (isFail(s) || isWin(s)) return []; const out = []; for (let ri = 0; ri < s.C.n; ri++) if (!ringLocked(s, ri)) out.push(ri * 2, ri * 2 + 1); return out; }
function applyMove(s, m){
  const ri = m >> 1, dir = (m & 1) ? -1 : 1;
  if (ri >= s.C.n || ringLocked(s, ri) || isFail(s)) return s;
  const n = cloneState(s);
  n.hist.push({ g: s.g.slice(), unl: s.unl, res: s.res });
  n.g[ri] = gNorm(s.g[ri] + dir);
  n.res = evalCircuit(n.C, n.g);
  const was = n.unl; n.unl = unlockFrom(n.C, n.res, n.unl);
  n.ev.push({ k: 'turn', ri, dir, g: n.g[ri] });
  if (n.unl !== was) for (let k = 0; k < n.C.n; k++) if ((n.unl & ~was) & (1 << k)) n.ev.push({ k: 'unlock', ri: k });
  n.ev.push({ k: n.res.kind, lit: n.res.lit, shunt: n.res.shunt });
  n.moves++;
  return n;
}
function undoMove(s){
  if (!s.hist.length) return s;
  const n = cloneState(s), h = n.hist.pop();
  n.g = h.g.slice(); n.unl = h.unl; n.res = h.res; n.moves--;
  return n;
}
function moveEvents(s, m){ const n = applyMove(s, m); return n === s ? [] : n.ev; }
function previewMove(s, m){ const n = applyMove(s, m); return n === s ? null : n; }

// ---- подробности цепи для рендера и причин: какие подковы, пятачки и точки под током / в замыкании ----
// Граф точек: рёбра — жилы подков (по текущему g) и пятачки. Путь — поиск в ширину по точкам.
function pointGraph(C, g){
  const adj = C.pts.map(() => []);
  for (let ri = 0; ri < C.n; ri++){ const t = tipsOf(g[ri]), a = C.tipPt[ri][t[0]], b = C.tipPt[ri][t[1]]; adj[a].push({ to: b, ri, from: a }); adj[b].push({ to: a, ri, from: b }); }
  C.padPts.forEach((pp, pi) => { for (let i = 0; i < pp.length; i++) for (let k = 0; k < pp.length; k++) if (i !== k) adj[pp[i]].push({ to: pp[k], pad: pi }); });
  return adj;
}
function wirePath(C, g, from, to){   // путь по жилам и пятачкам (без лампочек): [{ri|pad, from, to}] или null
  const adj = pointGraph(C, g), prev = new Map([[from, null]]), q = [from];
  for (let qi = 0; qi < q.length; qi++){ const u = q[qi]; if (u === to) break; for (const e of adj[u]) if (!prev.has(e.to)){ prev.set(e.to, { u, e }); q.push(e.to); } }
  if (!prev.has(to)) return null;
  const path = []; for (let at = to; prev.get(at); at = prev.get(at).u) path.push(prev.get(at).e); return path.reverse();
}
// Ток при победе (и частичном свечении): от + по жилам, через горящие лампочки, до −. Для каждой подковы — порядок (шаг от +),
// для каждой жилы — с какого конца входит ток.
function currentFlow(C, g, res){
  const adj = pointGraph(C, g), dist = new Map([[C.P, 0]]), q = [C.P];
  C.lamps.forEach((lp, li) => { if (res.lit & (1 << li)){ adj[lp.a].push({ to: lp.b, lamp: li, from: lp.a }); adj[lp.b].push({ to: lp.a, lamp: li, from: lp.b }); } });
  for (let qi = 0; qi < q.length; qi++){ const u = q[qi]; for (const e of adj[u]){ if (!dist.has(e.to)){ dist.set(e.to, dist.get(u) + 1); q.push(e.to); } } }
  const rings = {}, lamps = {};
  for (let ri = 0; ri < C.n; ri++){ const t = tipsOf(g[ri]), a = C.tipPt[ri][t[0]], b = C.tipPt[ri][t[1]];
    if (!dist.has(a)) continue;
    const da = dist.get(a), db = dist.get(b); rings[ri] = { step: Math.min(da, db), fromTip: da <= db ? t[0] : t[1] }; }
  C.lamps.forEach((lp, li) => { if (res.lit & (1 << li)) lamps[li] = { step: Math.min(dist.get(lp.a), dist.get(lp.b)) }; });
  const maxStep = Math.max(1, ...Object.values(rings).map(x => x.step + 1), ...Object.values(lamps).map(x => x.step + 1));
  return { rings, lamps, maxStep, dist };
}
// Что замкнуло: подковы и точки на пути замыкания (для почернения жил, искр и причины).
function faultInfo(C, g, res){
  if (res.kind === 'short'){ const path = wirePath(C, g, C.P, C.M); return { kind: 'short', path, rings: path ? [...new Set(path.filter(e => e.ri !== undefined).map(e => e.ri))] : [] }; }
  if (res.kind === 'shunt'){ const lp = C.lamps[res.shunt], path = wirePath(C, g, lp.a, lp.b); return { kind: 'shunt', lamp: res.shunt, path, rings: path ? [...new Set(path.filter(e => e.ri !== undefined).map(e => e.ri))] : [] }; }
  return null;
}
function listRu(ids){ return ids.length <= 1 ? ids.join('') : ids.slice(0, -1).join(', ') + ' и ' + ids[ids.length - 1]; }
function lampName(L, li){ return L.lamps.length > 1 ? 'лампочку ' + (li + 1) : 'лампочку'; }
function failReason(s){
  if (!isFail(s)) return null;
  const C = s.C, f = faultInfo(C, s.g, s.res), ids = f.rings.map(ri => s.L.rings[ri].id);
  const by = ids.length ? (ids.length > 1 ? 'по подковам ' : 'по подкове ') + listRu(ids) : 'напрямую';
  if (f.kind === 'short') return 'Короткое замыкание: плюс соединился с минусом ' + by + ' — в обход лампочки.';
  return 'Ток обошёл ' + lampName(s.L, f.lamp) + ' ' + by + ': она закорочена.';
}

// ---- солвер: поиск в ширину по положениям подков; замыкание — тупик (дальше не идём) ----
function solve(s){
  if (isWin(s)) return [];
  if (isFail(s)) return null;
  const start = cloneState(s); start.hist = [];
  const seen = new Map([[stateKey(start), null]]), q = [start];
  for (let qi = 0; qi < q.length && seen.size < CFG.SOLVE_LIMIT; qi++){
    const cur = q[qi], ck = stateKey(cur);
    for (const m of legalMoves(cur)){
      const nx = applyMove(cur, m); nx.hist = []; const k = stateKey(nx);
      if (seen.has(k)) continue;
      seen.set(k, { from: ck, move: m });
      if (isWin(nx)){ const path = []; let at = k; while (seen.get(at)){ path.push(seen.get(at).move); at = seen.get(at).from; } return path.reverse(); }
      if (!isFail(nx)) q.push(nx);
    }
  }
  return null;
}
// Полный граф уровня: достижимые состояния; good — откуда победа ещё достижима без замыканий.
const GRAPH = new WeakMap();
function graphOf(L){
  let G0 = GRAPH.get(L); if (G0) return G0;
  const s = createState(-1, L), seen = new Map(), q = [s]; seen.set(stateKey(s), { win: isWin(s), fail: isFail(s), next: [] });
  for (let qi = 0; qi < q.length && seen.size < CFG.SOLVE_LIMIT; qi++){
    const cur = q[qi], ck = stateKey(cur), node = seen.get(ck);
    if (node.win || node.fail) continue;
    for (const m of legalMoves(cur)){
      const nx = applyMove(cur, m); nx.hist = []; const k = stateKey(nx);
      node.next.push(k);
      if (!seen.has(k)){ seen.set(k, { win: isWin(nx), fail: isFail(nx), next: [] }); q.push(nx); }
    }
  }
  const prev = new Map(); for (const [k, v] of seen) for (const x of v.next){ if (!prev.has(x)) prev.set(x, []); prev.get(x).push(k); }
  const good = new Set(), st = [];
  for (const [k, v] of seen) if (v.win){ good.add(k); st.push(k); }
  while (st.length){ const k = st.pop(); for (const p of (prev.get(k) || [])) if (!good.has(p) && !seen.get(p).fail){ good.add(p); st.push(p); } }
  G0 = { seen, good }; GRAPH.set(L, G0); return G0;
}
function isDead(s){ if (isWin(s)) return false; if (isFail(s)) return true; const G0 = graphOf(s.L), k = stateKey(s); if (G0.seen.has(k)) return !G0.good.has(k); return solve(s) === null; }

// Все положения подков (без замков): сколько побед, замыканий, шунтов.
function census(L){
  const C = compile(L), n = C.n, total = Math.pow(CFG.POS, n), g = new Array(n).fill(0), out = { total, win: 0, short: 0, shunt: 0, open: 0 }, r = {};
  for (let x = 0; x < total; x++){ let y = x; for (let i = 0; i < n; i++){ g[i] = y % 8; y = (y - g[i]) / 8; } evalCircuit(C, g, r); out[r.kind]++; }
  return out;
}
function analyze(li){
  const s = typeof li === 'object' ? (li.g && li.C ? li : createState(-1, li)) : createState(li);
  const G0 = graphOf(s.L), sol = solve(s);
  const firstFail = legalMoves(s).filter(m => isFail(applyMove(s, m)));
  const firstDead = legalMoves(s).filter(m => !G0.good.has(stateKey(applyMove(s, m))));
  return { states: G0.seen.size, good: G0.good.size, par: sol ? sol.length : -1, sol, firstMoves: legalMoves(s).length, firstFail, firstDead, solvable: G0.good.has(stateKey(s)) };
}

// ---- проверка раскладки ----
function layoutErrors(L){
  const C = compile(L), out = C.errs.slice(), R = CFG.R, T = CFG.TUBE_R;
  for (let i = 0; i < L.rings.length; i++) for (let k = i + 1; k < L.rings.length; k++){
    const a = ringCenter(L.rings[i]), b = ringCenter(L.rings[k]), d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 2 * R - 0.01) out.push('подковы ' + L.rings[i].id + ' и ' + L.rings[k].id + ' налезают (d=' + d.toFixed(2) + ')');
    if (L.rings[i].id === L.rings[k].id) out.push('два раза подкова ' + L.rings[i].id);
  }
  for (const r of L.rings) if (!(r.g >= 0 && r.g < CFG.POS)) out.push('подкова ' + r.id + ': положение ' + r.g);
  if (C.P === C.M) out.push('+ и − батарейки на одной клемме');
  C.lamps.forEach((lp, li) => { if (lp.a === lp.b) out.push('лампочка ' + L.lamps[li].id + ': выводы на одной клемме'); });
  for (const pd of (L.pads || [])) if (pd.tips.length < 2) out.push('пятачок ' + pd.id + ' касается одной точки — он ничего не соединяет');
  const s = createState(-1, L);
  if (isFail(s)) out.push('замыкание на старте');
  if (isWin(s)) out.push('цепь замкнута на старте');
  return out;
}

// ---- боты (PROTO-BASE §6) ----
// Случайный — любой щелчок, пока не победа или замыкание.
function randomRun(li, seed, def){
  const rnd = mulberry32(seed); let s = createState(li, def);
  for (let k = 0; k < CFG.RANDOM_MOVES && !isWin(s) && !isFail(s); k++){ const m = legalMoves(s); if (!m.length) break; s = applyMove(s, m[Math.floor(rnd() * m.length)]); }
  return { win: isWin(s), fail: isFail(s), moves: s.moves };
}
// Тапальщик — только тапы (по часовой) по случайной подкове.
function tapRun(li, seed, def){
  const rnd = mulberry32(seed); let s = createState(li, def);
  for (let k = 0; k < CFG.RANDOM_MOVES && !isWin(s) && !isFail(s); k++){ const m = legalMoves(s).filter(x => !(x & 1)); if (!m.length) break; s = applyMove(s, m[Math.floor(rnd() * m.length)]); }
  return { win: isWin(s), fail: isFail(s), moves: s.moves };
}
// Жадный — «соединяет плюс с минусом кратчайшим путём»: лампочку считает просто проводом. Ищет положение подков с наименьшим
// числом щелчков, где + и − связаны (через лампочки или напрямую — ему всё равно; при равенстве берёт победное),
// и крутит подковы по очереди (A, B, …) кратчайшей стороной (при равенстве — по часовой). Замкнул — попался.
function naiveTarget(C, g0, unl){
  const n = C.n, total = Math.pow(CFG.POS, n), g = new Array(n).fill(0), p = C.par, r = {};
  let best = null, bc = Infinity, bw = false;
  for (let x = 0; x < total; x++){
    let y = x, cost = 0, ok = true;
    for (let i = 0; i < n; i++){ g[i] = y % 8; y = (y - g[i]) / 8; const d = circDist(g0[i], g[i]); if (d && C.lockLamp[i] >= 0 && !(unl & (1 << i))){ ok = false; break; } cost += d; }
    if (!ok || cost > bc) continue;
    p.set(C.base);
    for (let ri = 0; ri < n; ri++){ const t = tipsOf(g[ri]); unite(p, C.tipPt[ri][t[0]], C.tipPt[ri][t[1]]); }
    for (const lp of C.lamps) unite(p, lp.a, lp.b);
    if (find(p, C.P) !== find(p, C.M)) continue;
    const win = evalCircuit(C, g, r).kind === 'win';
    if (cost < bc || (win && !bw)){ bc = cost; best = g.slice(); bw = win; }
  }
  return best;
}
function greedyRun(li, def){
  let s = createState(li, def); const path = [];
  for (let plan = 0; plan < 8 && !isWin(s) && !isFail(s); plan++){
    const tgt = naiveTarget(s.C, s.g, s.unl); if (!tgt) return { win: false, moves: s.moves, path, stuck: true };
    let moved = false;
    for (let ri = 0; ri < s.C.n && !isWin(s) && !isFail(s); ri++){
      if (ringLocked(s, ri)) continue;
      while (s.g[ri] !== tgt[ri] && !isFail(s) && !isWin(s)){
        const d = gNorm(tgt[ri] - s.g[ri]), m = moveOf(ri, d <= 4 ? 1 : -1);
        s = applyMove(s, m); path.push(m); moved = true;
      }
    }
    if (!moved) break;
  }
  return { win: isWin(s), fail: isFail(s), moves: s.moves, path, trappedAt: isFail(s) ? s.moves : -1, reason: isFail(s) ? failReason(s) : null };
}

// --- раскладка: где стоят корпуса батарейки и лампочек (из уровня или по клеммам) ---
function fieldBox(L, Cc){
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const r of L.rings){ const c = ringCenter(r), e = CFG.R + CFG.TUBE_R; x0 = Math.min(x0, c.x - e); x1 = Math.max(x1, c.x + e); y0 = Math.min(y0, c.y - e); y1 = Math.max(y1, c.y + e); }
  for (const p of Cc.pts) if (p.node){ x0 = Math.min(x0, p.x - 0.3); x1 = Math.max(x1, p.x + 0.3); }
  return { x0, x1, y0, y1 };
}
function placeComponents(L, Cc){
  const fb = fieldBox(L, Cc), P = Cc.pts[Cc.P], M = Cc.pts[Cc.M];
  const vert = Math.abs(P.y - M.y) > Math.abs(P.x - M.x);
  const bat = { x: L.bat.x !== undefined ? L.bat.x : (P.x + M.x) / 2, y: L.bat.y !== undefined ? L.bat.y : fb.y0 - 0.62, plusRight: P.x >= M.x, vert, plusUp: P.y >= M.y };
  bat.ang = vert ? (bat.plusUp ? Math.PI / 2 : -Math.PI / 2) : (bat.plusRight ? 0 : Math.PI);   // куда смотрит + (модель: + справа)
  const lamps = L.lamps.map((lp, li) => {
    const a = Cc.pts[Cc.lamps[li].a], b = Cc.pts[Cc.lamps[li].b], mx = (a.x + b.x) / 2;
    return { x: lp.x !== undefined ? lp.x : mx, y: lp.y !== undefined ? lp.y : fb.y1 + 0.3, aLeft: a.x <= b.x };
  });
  return { fb, bat, lamps };
}

// --- сборка уровня ---
function disposeLevel(){
  const lv = R3.level; if (!lv) return;
  R3.scene.remove(lv.root);
  lv.root.traverse(o => { if (o.isMesh && o.userData.ownGeo) o.geometry.dispose(); if (o.isMesh && o.userData.ownMat) o.material.dispose(); });
  R3.level = null;
}
function buildLevel(L, noWarm){

  const root = new THREE.Group(), lv = { L, Cc, root, rings: [], lamps: [], clamps: [], scorch: [], flashes: [] };
  const own = (m) => { m.userData.ownMat = true; return m; };
  const gs = G.s ? G.s.g : L.rings.map(r => r.g);
  const lay = placeComponents(L, Cc); lv.lay = lay;
  // подковы: стекло-дуга, медная жила, медные наконечники, спицы к винту, винт; поворотная часть — rot

    const rot = new THREE.Group(); g.add(rot);
    const arc = new THREE.Group(); arc.rotation.z = ARC0; rot.add(arc);
    const core = own(new THREE.Mesh(R3.geo.core, coreMaterial())); core.renderOrder = 1; arc.add(core);
    const back = own(new THREE.Mesh(R3.geo.glass, glassMaterial(true))); back.renderOrder = 2; arc.add(back);
    const front = own(new THREE.Mesh(R3.geo.glass, glassMaterial(false))); front.renderOrder = 3; arc.add(front);
    for (const a of [0, 1.5 * Math.PI]){                 // медные наконечники открытых концов

      cap.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-Math.sin(a), Math.cos(a), 0)); arc.add(cap);
      const tip = new THREE.Mesh(R3.geo.capTip, R3.mat.copper); tip.position.set(Math.cos(a) * CFG.R, Math.sin(a) * CFG.R, -0.06); arc.add(tip);
    }

      const sp = new THREE.Mesh(R3.geo.spoke, R3.mat.brass), len = CFG.R - CFG.TUBE_R - 0.12;
      sp.scale.set(1, len, 1); sp.position.set(Math.cos(a) * (0.14 + len / 2), Math.sin(a) * (0.14 + len / 2), -0.05); sp.rotation.z = a - Math.PI / 2; arc.add(sp);

    const screw = makeScrew(); screw.position.z = 0.02; g.add(screw);
    const shadow = new THREE.Mesh(R3.geo.disk, R3.mat.blob); shadow.scale.setScalar(1.25); shadow.position.set(0.06, -0.08, PZ + 0.012); g.add(shadow);
    let lock = null, lockBadge = null;

    else { const m = new THREE.Mesh(R3.geo.disk, R3.mat.hole); m.scale.setScalar(0.06); m.position.set(p.x, p.y, PZ + 0.025); root.add(m); } });

      const gl = new THREE.Mesh(R3.geo.plane, R3.mat.ringGlow[role]); gl.scale.setScalar(1.05); gl.position.set(p.x, p.y, PZ + 0.03); gl.renderOrder = 1; root.add(gl); }

    const body = makeBattery(); body.rotation.z = B.ang; bg.add(body);
    const sh = new THREE.Mesh(R3.geo.plane, R3.mat.blob); sh.scale.set(VIEW.BAT_L * 1.2, 0.7, 1); sh.rotation.z = B.ang; sh.position.set(0.05, -0.12, -VIEW.BAT_D / 2 + 0.01); bg.add(sh);
    root.add(bg); lv.bat = bg;
    const ex = Math.cos(B.ang) * VIEW.BAT_L / 2, ey = Math.sin(B.ang) * VIEW.BAT_L / 2;
    const ends = { p: new THREE.Vector3(B.x + ex, B.y + ey, bg.position.z), m: new THREE.Vector3(B.x - ex, B.y - ey, bg.position.z) };

      b.position.set(e.x + Math.cos(B.ang) * k * 0.3, e.y + Math.sin(B.ang) * k * 0.3, e.z + 0.35); b.scale.setScalar(VIEW.BADGE * 0.9); root.add(b); }

    const shelf = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.06, 0.72), R3.mat.brass); shelf.userData.ownGeo = true; shelf.position.set(0, -0.03, 0); g.add(shelf);
    const base = makeLampBase(); g.add(base);

    const halo = new THREE.Mesh(R3.geo.plane, R3.mat.halo.clone()); halo.userData.ownMat = true; halo.position.set(0, VIEW.LAMP_H * 0.62 + VIEW.BULB_R * 0.75, 0.45); halo.renderOrder = 8; halo.visible = false; g.add(halo);

// Наружу от подков: направление от ближайшего центра подковы к точке (значок не налезает на дугу).
function outward(L, p){ let best = null, bd = Infinity; for (const r of L.rings){ const c = ringCenter(r), d = Math.hypot(p.x - c.x, p.y - c.y); if (d < bd){ bd = d; best = c; } }

// Куда подходит провод: к клемме; если вывод на пятачке или дорожке — к ближайшей к корпусу точке пятачка.
function pinPoint(L, Cc, ref, pi, from){

// Вывод (провод): от вывода корпуса к клемме — отходит вперёд, ложится на панель и идёт к клемме.
function leadMesh(from, to, mat, kind){

function contentBox(lv){
  const b = { ...lv.lay.fb };
  b.y0 = Math.min(b.y0, lv.lay.bat.y - (lv.lay.bat.vert ? VIEW.BAT_L / 2 + 0.2 : VIEW.BAT_D / 2 + 0.4));
  const bw = lv.lay.bat.vert ? VIEW.BAT_D / 2 + 0.2 : VIEW.BAT_L / 2 + 0.15, bh = lv.lay.bat.vert ? VIEW.BAT_L / 2 + 0.2 : VIEW.BAT_D / 2 + 0.4;
  b.x0 = Math.min(b.x0, lv.lay.bat.x - bw); b.x1 = Math.max(b.x1, lv.lay.bat.x + bw); b.y1 = Math.max(b.y1, lv.lay.bat.y + bh);

  return b;
}
// Панель электрика (Tripo) во весь кадр: внешний край рамы чуть за краем экрана, видна внутренняя кромка рамы.
// Пересобирается при смене размера кадра (fit → frameCamera → fitPanel).
function fitPanel(){

  const cam = R3.camera, dz = cam.position.z - VIEW.PANEL_Z, t = Math.tan(THREE.MathUtils.degToRad(VIEW.FOV / 2));
  const vh = 2 * t * dz, vw = vh * cam.aspect, w = vw * 1.1, h = vh * 1.06, cx = cam.position.x, cy = R3.camLook.y;
  let g;

    hold.scale.set(hold.scale.x * w / sz.x, hold.scale.y * h / sz.y, hold.scale.z * 0.9 / sz.z); g.position.set(cx, cy, VIEW.PANEL_Z - 0.45 + 0.02); }
  else { g = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), new THREE.MeshStandardMaterial({ color: 0x2f4f78, roughness: 0.85 })); g.userData.ownGeo = true; g.position.set(cx, cy, VIEW.PANEL_Z - 0.1); }

function frameCamera(){

function applyPath(path, instant){
  for (const m of path){ G.s = applyMove(G.s, m); if (isFail(G.s) || isWin(G.s)) break; }
  const lv = R3 && R3.level; if (lv) lv.rings.forEach((R, ri) => { R.cont = R.vis = G.s.g[ri]; R.anim = null; });
  resolvePending(); if (instant){ G.shown.t0 = now() - 5000; if (G.won) G.won = now() + 50; }
}

// --- частицы (позиции — функция от абсолютного времени) ---
function spawn(kind, p, v, life, size, color){
  R3.parts.push({ kind, p: p.clone(), v: v.clone(), t0: now(), life: life / G.timeScale, size, color: color ? lin(color) : null });
  if (R3.parts.length > VIEW.POOL_SPARKS + VIEW.POOL_SMOKE + VIEW.POOL_GLINTS) R3.parts.shift();
}
const rndFx = mulberry32(99);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _white = new THREE.Color(1, 1, 1);
function updateParts(tNow){
  let ns = 0, nm = 0, ng = 0;
  R3.parts = R3.parts.filter(q => tNow - q.t0 < q.life);
  for (const q of R3.parts){
    const t = (tNow - q.t0) / 1000 * G.timeScale, k = (tNow - q.t0) / q.life;
    if (q.kind === 'smoke'){
      if (nm >= VIEW.POOL_SMOKE) continue;
      _p.set(q.p.x + q.v.x * t + Math.sin(t * 2 + q.p.x * 5) * 0.06, q.p.y + q.v.y * t, q.p.z + q.v.z * t);
      _s.setScalar(q.size * (0.6 + 2.2 * k) * (k > 0.8 ? (1 - k) * 5 : 1)); _m.compose(_p, _q, _s); R3.smoke.setMatrixAt(nm++, _m);
    } else {
      const g = q.kind === 'spark' ? -7.0 : -1.2, pool = q.kind === 'spark' ? R3.sparks : R3.glints, n = q.kind === 'spark' ? ns : ng;
      if (n >= (q.kind === 'spark' ? VIEW.POOL_SPARKS : VIEW.POOL_GLINTS)) continue;
      _p.set(q.p.x + q.v.x * t, q.p.y + q.v.y * t + 0.5 * g * t * t, q.p.z + q.v.z * t);
      _s.setScalar(q.size * (1 - k * 0.7)); _m.compose(_p, _q, _s); pool.setMatrixAt(n, _m); pool.setColorAt(n, q.color || _white);
      if (q.kind === 'spark') ns++; else ng++;
    }
  }
  R3.sparks.count = ns; R3.smoke.count = nm; R3.glints.count = ng;
  for (const pm of [R3.sparks, R3.smoke, R3.glints]){ pm.instanceMatrix.needsUpdate = true; if (pm.instanceColor) pm.instanceColor.needsUpdate = true; }
}
const ease = { out: (x) => 1 - Math.pow(1 - x, 3), inOut: (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, back: (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); } };

// --- ввод: Pointer Events. Палец на подкове: драг крутит её за пальцем, щелчок — на полпути до соседнего положения;
// тап (сдвиг меньше 10 px, ни одного щелчка) — один щелчок по часовой. pointercancel = отпускание без тапа (§3). ---
const cv = $('gl');
function ringScreen(ri){
  const c0 = ringCenter(G.s.L.rings[ri]), rect = cv.getBoundingClientRect();
  const c = new THREE.Vector3(c0.x, c0.y, 0).project(R3.camera), e = new THREE.Vector3(c0.x + CFG.R, c0.y, 0).project(R3.camera);
  const x = (c.x + 1) / 2 * rect.width, y = (1 - c.y) / 2 * rect.height, ex = (e.x + 1) / 2 * rect.width;
  return { x, y, rpx: Math.abs(ex - x) };
}
function pickRing(cx, cy){
  if (!R3 || !R3.level || !G.s) return -1;
  const rect = cv.getBoundingClientRect(), x = cx - rect.left, y = cy - rect.top; let best = -1, bd = Infinity;
  G.s.L.rings.forEach((r, ri) => { const s = ringScreen(ri), d = Math.hypot(s.x - x, s.y - y) / s.rpx; if (d < VIEW.PICK_R && d < bd){ bd = d; best = ri; } });
  return best;
}
function pointerAngle(P, e){ const rect = cv.getBoundingClientRect(); return Math.atan2(e.clientY - rect.top - P.cy, e.clientX - rect.left - P.cx); }
cv.addEventListener('pointerdown', (e) => {
  Snd.init(); if (G.screen !== 'game' || !G.s || G.press) return;
  const ri = pickRing(e.clientX, e.clientY);
  if (ri < 0){ log('input', 'miss'); return; }
  if (isFail(G.s)){ log('input', 'press', 'fail'); Snd.deny(); toast('Сначала отмени ход — тут замыкание'); return; }
  if (isWin(G.s)) return;
  if (ringLocked(G.s, ri)){ log('input', 'press', 'ring=' + G.s.L.rings[ri].id + ' locked'); Snd.deny(); buzz(15); toast('Подкова ' + G.s.L.rings[ri].id + ' на замке: зажги лампочку ' + (G.s.C.lockLamp[ri] + 1)); R3.level.rings[ri].shake = now(); return; }
  const s = ringScreen(ri);
  G.press = { ri, id: e.pointerId, x: e.clientX, y: e.clientY, cx: s.x, cy: s.y, rpx: s.rpx, a: 0, acc: 0, drag: false, dir: 0, clicks: 0 };
  G.press.a = pointerAngle(G.press, e);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  G.hint = null;
  log('input', 'press', 'ring=' + G.s.L.rings[ri].id);
});
cv.addEventListener('pointermove', (e) => {
  const P = G.press; if (!P || e.pointerId !== P.id) return;
  const rect = cv.getBoundingClientRect(), dx = e.clientX - rect.left - P.cx, dy = e.clientY - rect.top - P.cy;
  if (!P.drag && Math.hypot(e.clientX - P.x, e.clientY - P.y) > VIEW.TAP_PX){ P.drag = true; log('input', 'drag', 'ring=' + G.s.L.rings[P.ri].id); }
  const a = pointerAngle(P, e);
  if (Math.hypot(dx, dy) < P.rpx * 0.3){ P.a = a; return; }             // у центра угол пляшет — не крутим
  let d = a - P.a; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; P.a = a;
  if (!P.drag) return;
  P.acc += d;
  if (Math.abs(d) > 0.004) P.dir = d > 0 ? 1 : -1;
  while (Math.abs(P.acc) >= STEP * 0.5){
    const dir = P.acc > 0 ? 1 : -1;
    if (G.pending) resolvePending();
    if (isFail(G.s) || isWin(G.s)){ P.acc = 0; break; }
    P.acc -= dir * STEP; P.clicks++;
    if (!turnRing(P.ri, dir, 'drag')) { P.acc = 0; break; }
  }
});
function onUp(e){
  const P = G.press; if (!P || e.pointerId !== P.id) return;
  G.press = null;
  const R = R3 && R3.level && R3.level.rings[P.ri];
  if (R && P.drag){ R.anim = { from: R.vis, to: R.cont, t0: now(), ms: 140, back: false }; }
  if (e.type === 'pointercancel') return;
  if (!P.drag && !P.clicks) turnRing(P.ri, 1, 'tap');
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {            // дубли на клавиатуру (§3): цифра — по часовой, Shift+цифра — против
  const mm = /^Digit([1-9])$/.exec(e.code);
  if (mm && G.s){ if (G.pending) resolvePending(); turnRing(+mm[1] - 1, e.shiftKey ? -1 : 1, 'key'); }
  if (e.key === 'z' || e.key === 'u') undo(); if (e.key === 'r' && G.s) startLevel(G.s.li); if (e.key === 'm') goto('menu'); if (e.key === 'h') showHint();
  if (e.key === 'n' && G.s && isWin(G.s)) nextLevel();
});
function nextLevel(){ const li = G.s ? G.s.li + 1 : 0; if (li >= LEVELS.length) goto('menu'); else startLevel(li); }
$('btn-undo').onclick = () => { Snd.init(); log('input', 'button', 'undo'); undo(); };
$('btn-reset').onclick = () => { Snd.init(); log('input', 'button', 'reset'); if (G.s) startLevel(G.s.li); };
$('btn-hint').onclick = () => { Snd.init(); log('input', 'button', 'hint'); if (G.s && !G.pending) showHint(); };
$('btn-menu').onclick = () => { Snd.init(); log('input', 'button', 'menu'); Snd.humOff(); goto('menu'); };
$('btn-mute').onclick = () => { Snd.init(); G.save.muted = !G.save.muted; save(); hud(); if (G.save.muted) Snd.humOff(); log('input', 'button', 'mute=' + G.save.muted); };
$('dead-undo').onclick = () => { Snd.init(); log('input', 'button', 'dead.undo'); undo(); };
$('won-next').onclick = () => { Snd.init(); log('input', 'button', 'won.next'); Snd.humOff(); nextLevel(); };

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
let lastW = 0, lastH = 0;
function fit(){
  if (!R3) return;
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  if (r.width === lastW && r.height === lastH) return; lastW = r.width; lastH = r.height;
  R3.renderer.setPixelRatio(R3.dpr); R3.renderer.setSize(r.width, r.height, false);
  R3.camera.aspect = r.width / r.height; frameCamera(); fitPanel();
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); if (G.paused) Snd.humOff(); else if (G.s && G.s.res.lit && !isFail(G.s)) Snd.humOn(0.6); });

// --- кадр ---
function renderFrame(){
  if (!R3) return;
  const tNow = now(), t0 = performance.now();
  if (G.pending && tNow >= G.pending) resolvePending();
  if (R3.level && G.shown){
    syncView(tNow);
    updateParts(tNow);
    const F = window.ZAMKNI_TSEP && window.ZAMKNI_TSEP.flags;
    if (F && F.noParts){ R3.sparks.count = 0; R3.smoke.count = 0; R3.glints.count = 0; }
  }
  R3.renderer.render(R3.scene, R3.camera);
  const dt = performance.now() - t0;
  R3.frames.push(dt); if (R3.frames.length > 240) R3.frames.shift();
  if (G.celebrate && tNow >= G.celebrate) celebrate();
  if (G.won && tNow >= G.won) showWon();
  if (toastUntil && tNow > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}
let lastFrame = 0;
function spinning(){ const lv = R3 && R3.level; return !!(lv && (G.spinDemo || (G.press && G.press.drag) || lv.rings.some(R => R.anim))); }
function animating(){ const S = G.shown; return !!(G.pending || (S && now() - S.t0 < CFG.FLOW_MS * 1.2 / G.timeScale) || (R3 && R3.parts.length)); }
function frame(){
  const t = performance.now();
  if (G.bench && lastFrame){ if (spinning()) G.bench.spin.push(t - lastFrame); else if (animating()) G.bench.fx.push(t - lastFrame); }
  lastFrame = t; if (!G.paused) renderFrame(); requestAnimationFrame(frame);
}
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) renderFrame(); }, 40);   // rAF + сторож: безопасно, время абсолютное (§4)

// --- дебаг-хук (§6) ---
const waitFrames = () => new Promise(res => requestAnimationFrame(res));
function benchStats(ints){
  ints = ints.slice().sort((a, b) => a - b); const avg = ints.reduce((a, b) => a + b, 0) / Math.max(1, ints.length);
  return { frames: ints.length, fps: +(1000 / Math.max(1e-6, avg)).toFixed(1), p95ms: +(ints[Math.floor(ints.length * 0.95)] || 0).toFixed(1), long: ints.filter(x => x > 25).length };
}
window.ZAMKNI_TSEP = {
  G, LEVELS, PERF,
  state(){ return G.s ? { level: G.s.li + 1, name: G.s.L.name, g: G.s.g.join(''), kind: G.s.res.kind, lit: G.s.res.lit, unl: G.s.unl, moves: G.s.moves, par: G.par,
    win: isWin(G.s), fail: isFail(G.s), reason: failReason(G.s), pending: !!G.pending, screen: G.screen,
    banner: $('dead').classList.contains('show') ? 'dead' : $('won').classList.contains('show') ? 'won' : '' } : { screen: G.screen }; },
  play(n){ startLevel(Math.max(0, Math.min(LEVELS.length, n || 1) - 1)); return this.state(); },
  turn(ri, dir){ if (G.pending) resolvePending(); turnRing(ri, dir || 1, 'key'); return this.state(); },
  tap(ri){ if (G.pending) resolvePending(); turnRing(ri, 1, 'tap'); return this.state(); },
  press(ri, dir){ G.press = { ri, id: -1, x: 0, y: 0, cx: 0, cy: 0, rpx: 1, a: 0, acc: 0, drag: false, dir: dir || 0, clicks: 0 }; const n = previewMoveState(G.s, moveOf(ri, dir || 1)); return n ? { kind: n.res.kind, lit: n.res.lit } : null; },
  release(){ const P = G.press; G.press = null; return P ? turnRing(P.ri, P.dir || 1, 'tap') : false; },
  undo(){ undo(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  solve(){ return G.s ? solve(G.s) : null; },
  hint(){ showHint(); return G.hint; },
  auto(delayMs){ const path = this.solve() || []; path.forEach((m, k) => setTimeout(() => { if (G.pending) resolvePending(); turnRing(m >> 1, (m & 1) ? -1 : 1, 'auto'); }, (delayMs || 900) * k)); return path; },
  greedy(){ return G.s ? greedyRun(G.s.li).path : []; },
  drive(sec, stepMs){                         // ручной прогон времени: rAF заморожен в скрытой вкладке/превью
    const step = stepMs || 1000 / 60, n = Math.round(sec * 1000 / step);
    for (let i = 0; i < n; i++){ T.off += step; renderFrame(); }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  rings(){ return G.s ? G.s.L.rings.map((r, ri) => ({ ri, id: r.id, g: G.s.g[ri], locked: ringLocked(G.s, ri), screen: R3 && R3.level ? ringScreen(ri) : null })) : []; },
  async bench(rounds){                        // замер кадра: решение текущего уровня на реальном rAF; эффекты и кручение отдельно
    rounds = rounds || 2; const li = G.s ? G.s.li : 6, cpu = []; G.bench = { fx: [], spin: [] };
    for (let r = 0; r < rounds; r++){
      startLevel(li); await new Promise(res => setTimeout(res, 300));
      const path = solve(G.s) || [];
      for (const m of path){
        R3.frames.length = 0; if (G.pending) resolvePending(); turnRing(m >> 1, (m & 1) ? -1 : 1, 'auto');
        while (spinning() || G.pending) await waitFrames();
        cpu.push(...R3.frames);
      }
      for (const t0 = performance.now(); performance.now() - t0 < 1600;) await waitFrames();
      startLevel(2); applyPath(greedyRun(2).path); for (const t0 = performance.now(); performance.now() - t0 < 1500;) await waitFrames();
    }
    startLevel(li);
    G.spinDemo = now(); for (const t0 = performance.now(); performance.now() - t0 < 2000;) await waitFrames(); G.spinDemo = 0;
    const B = G.bench; G.bench = null; cpu.sort((a, b) => a - b);
    const out = { fx: benchStats(B.fx), spin: benchStats(B.spin), cpuAvgMs: +(cpu.reduce((a, b) => a + b, 0) / Math.max(1, cpu.length)).toFixed(2),
      cpuP95ms: +(cpu[Math.floor(cpu.length * 0.95)] || 0).toFixed(2), dpr: R3.dpr, size: R3.renderer.domElement.width + '×' + R3.renderer.domElement.height };
    log('event', 'bench', JSON.stringify(out)); return out;
  },
  startup(){ return PERF; },
  get R3(){ return R3; },
  flags: {},
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт: меню сразу (DOM), GL и модели — следом; холст проявляется, когда шейдеры собраны и прогреты ---
hud();
const routed = routeHash();
if (!routed) goto('menu');
mark('menu');
(async function boot(){
  try {
    await new Promise(r => setTimeout(r, 0));
    initRenderer();
    lastW = 0; fit();
    await Promise.race([loadModels(), new Promise(r => setTimeout(r, 6000))]);
    if (!G.s){ G.s = createState(Math.min(G.save.level, LEVELS.length - 1)); G.shown = showState(G.s, now() - 10000); G.par = G.s.L.par !== undefined ? G.s.L.par : (solve(G.s) || []).length; }
    buildLevel(G.s.L, true); mark('level');
    if (R3.renderer.compileAsync) await R3.renderer.compileAsync(R3.scene, R3.camera); mark('compile');
    warmUp(); renderFrame(); mark('firstFrame');
    $('gl').classList.add('ready'); hud();
    requestAnimationFrame(frame);
    log('event', 'boot', 'levels=' + LEVELS.length + ' glb=' + Object.keys(GLB).join(','));
  } catch (err) { console.error(err); log('event', 'boot.fail', err.message); toast('3D не запустился: ' + err.message, 6000); }
})();
}
</script>
