<html lang="ru">

<title>Замкни цепь</title>

<style>
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(assets/fonts/nunito-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

/* Палитра — одно место (PROTO-BASE §9). Мастерская электрика: тёмная стена, синяя панель на деревянной раме, медь и латунь.
   3D-фон рисует шейдер теми же цветами (VIEW.BG_*). */
:root{
  --bg:#1b1f2a; --ink:#ffffff; --ink2:#23283a; --muted:#c9d2e6;
  --panel:#3d6fb0; --panel2:#244a80; --accent:#ffcf3a; --accent-ink:#4a2a00; --danger:#ff4d4d; --ok:#ffd76a; --card:#fbfaf5;
  --frame-w:440px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 "Nunito", system-ui, sans-serif;font-weight:700;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:linear-gradient(#3a4256,#20242f);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top);z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none}
header .title{display:flex;flex-direction:column;align-items:center;text-shadow:0 2px 0 rgba(0,0,0,.35)}
header .title b{font-size:20px;font-weight:900;letter-spacing:.2px} header .title span{font-size:13px;color:var(--muted)}
header button{pointer-events:auto}
.ico{width:44px;height:44px;border-radius:14px;border:0;background:var(--panel);box-shadow:0 4px 0 var(--panel2);display:grid;place-items:center;cursor:pointer;padding:0}
.ico svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ico.off .wave{display:none} .ico:not(.off) .slash{display:none}
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 66px);z-index:2;text-align:center;font-size:15px;color:#fff;padding:0 24px;pointer-events:none;
  text-shadow:0 2px 0 rgba(0,0,0,.4)}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .35s}
#game canvas.ready{opacity:1}
footer{position:relative;z-index:3;display:flex;gap:10px;justify-content:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(20,24,34,0),rgba(20,24,34,.55))}
footer button{flex:1;max-width:120px;height:56px;border:0;border-radius:16px;background:var(--panel);box-shadow:0 5px 0 var(--panel2);color:#fff;font:inherit;font-weight:800;font-size:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
footer button svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
footer button:disabled{opacity:.5}
footer button.pulse{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 #d79c00;animation:pulse 1s ease-in-out infinite}
footer button.pulse svg{stroke:var(--accent-ink)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
button:active{transform:translateY(2px)}
/* Плашки на месте (не попап): замыкание — красная, победа — тёплая. */
.banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 64px);z-index:4;display:none;background:rgba(255,255,255,.96);color:var(--ink2);border-radius:18px;
  padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:15px;line-height:1.3;gap:10px;align-items:center}
.banner.show{display:flex}
.banner b{display:block;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
#dead b{color:var(--danger)}
/* Победа — внизу, под пальцем: крупно, без цифр и звёзд (Э-3), большая «Дальше». Стартует с видимого состояния (§9). */
#won{top:auto;bottom:calc(env(safe-area-inset-bottom) + 90px);flex-direction:column;align-items:stretch;gap:8px;padding:14px 16px 16px;border-radius:24px;
  background:linear-gradient(#fffaf0,#fff1c9);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 3px #ffcf3a inset;animation:wonIn .35s cubic-bezier(.2,1.4,.4,1)}
#won .row{display:flex;align-items:center;gap:12px}
#won b{color:#b86e00;font-size:28px;font-weight:1000;letter-spacing:.3px;text-transform:none}
#won #won-text{color:#5a4a2a;font-size:15px}
#won button{width:100%;font-size:22px;padding:14px 16px;border-radius:16px}
@keyframes wonIn{from{transform:translateY(16px) scale(.97)}to{transform:none}}
#dead .zap{flex:none;width:30px;height:30px;margin:0 -4px} #won .zap{flex:none;width:34px;height:34px}
/* Искра картинкой: гнездо одного цвета ⚡ гнездо другого — без слов про плюсы и минусы. */
#dead .pic{display:flex;align-items:center;flex:none} #dead .pic svg.sock{width:34px;height:34px}
#dead .txt{flex:1} #dead b{font-size:22px;letter-spacing:.3px;text-transform:none}
.banner button{flex:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:900;padding:10px 12px;box-shadow:0 4px 0 #d79c00;cursor:pointer}
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(10,14,24,.55);padding:20px}
#overlay.show{display:flex}
.card{background:var(--card);color:var(--ink2);border-radius:26px;padding:24px 20px;max-width:350px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.45);
  animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}  /* стартует с видимого состояния (§9) */
.card h1.logo{margin:0 0 6px;font-size:40px;line-height:1.05;font-weight:1000;color:#fff;-webkit-text-stroke:2px #244a80;text-shadow:0 4px 0 #244a80}
.card h1.logo i{font-style:normal;color:var(--accent)}
.card h2{margin:0 0 8px;font-size:30px;font-weight:1000} .card p{color:#59607a;margin:0 0 16px;font-weight:700}
.card button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:12px 16px;background:#e3e9f6;color:var(--ink2);cursor:pointer;margin:4px}
.card button.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #d79c00}
.card button.big{font-size:20px;padding:14px 22px;width:100%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.levels .lv{margin:0;padding:12px 0;font-size:18px}
.levels .lv.done{background:#fff0b8;color:#8a5a00} .levels .lv.cur{outline:3px solid var(--panel)}
.rules{text-align:left;padding-left:18px;margin:0 0 14px;color:#3a405a;font-weight:700} .rules li{margin:6px 0}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:4;background:rgba(20,24,40,.9);color:#fff;padding:9px 16px;border-radius:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s;max-width:86%;text-align:center;font-size:15px}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ #won{animation:none} .card{animation:none} #toast{transition:none} footer button.pulse{animation:none} }

{ // весь код в блоке: three.cjs объявляет сотни глобальных const, одноимённые объявления на верхнем уровне упали бы
/* ЯДРО */

// «Замкни цепь» v0.3 «Цвета» — ядро правил. Исполняется игрой и sim.mjs/test.mjs (core-load.mjs вырезает этот блок из index.html).
//
// На панели — голые металлические подковы (дуга 270°, разрыв 90°) и цветные гнёзда парами: два синих, два жёлтых, …
// Подкова крутится вокруг оси щелчками по 45°. g — куда смотрит разрыв: 0 вверх, дальше по часовой на экране
// (1 вверх-вправо, 2 вправо, 3 вниз-вправо, 4 вниз, 5 вниз-влево, 6 влево, 7 вверх-влево).
// Концы подковы — по бокам разрыва, на направлениях g−1 и g+1: подкова соединяет две точки компаса через 90°.
// Оси стоят на решётке с шагом 2R, поэтому боковые концы (С, В, Ю, З) соседних подков сходятся в одной точке — стык.
//
// Что касается конца подковы: цветное гнездо, медный пятачок или конец соседней подковы. Пятачок соединяет всё, что его касается.
//
//   • Сеть — всё, что связано подковами и пятачками (union-find по точкам касания). Сеть считается после каждого щелчка.
//   • Гнёзда одного цвета в одной сети — пара соединена: по сети бежит ток этого цвета, гнёзда-плафоны горят.
//   • Разные цвета в одной сети — ИСКРА (короткое замыкание без плюсов и минусов). Ходы стоят до отмены, отмена бесплатна.
//   • Победа — соединены все пары и нигде нет искры.
//   • Замок: подкова не крутится, пока хоть раз не загорится пара её цвета.
// Ход m: подкова m>>1, m чётный — по часовой, нечётный — против.
// ---------------------------------------------------------------------------
const CFG = {
  R: 1.0,               // радиус осевой линии подковы, мировые единицы
  TUBE_R: 0.12,         // радиус металлического прутка подковы
  STEP: 2.0,            // шаг решётки осей (= 2R: концы соседних подков сходятся)
  POS: 8,               // положений разрыва; щелчок — 45°
  PAD_R: 0.16,          // радиус пятачка у точки касания (вид и проверка раскладки)
  EPS: 0.02,            // точки ближе — одна точка
  CLICK_MS: 130,        // щелчок подковы (анимация; ядро не зависит)
  FLOW_MS: 1100,        // ток бежит от гнезда до гнезда
  SPARK_MS: 900,        // искры и дым
  SOLVE_LIMIT: 700000,  // предел состояний перебора
  RANDOM_MOVES: 60,     // случайный бот: щелчков на партию
};
const DIR = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const GNAME = ['вверх', 'вверх-вправо', 'вправо', 'вниз-вправо', 'вниз', 'вниз-влево', 'влево', 'вверх-влево'];
// Цвета пар. Порядок — номер бита в res.lit. Форма на плафоне дублирует цвет (PROTO-BASE §9).
const COLORS = [
  { id: 'b', name: 'синий', ins: 'синим', shape: 'circle' },
  { id: 'y', name: 'жёлтый', ins: 'жёлтым', shape: 'tri' },
  { id: 'g', name: 'зелёный', ins: 'зелёным', shape: 'square' },
  { id: 'p', name: 'розовый', ins: 'розовым', shape: 'diamond' },
];
const COLOR_IX = new Map(COLORS.map((c, i) => [c.id, i]));

// Детерминированный генератор (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

// Уровни — декларативная таблица. Раскладки подобраны tools/levelsearch.mjs и доведены руками.
// Подкова: id, c/r — клетка решётки (центр = c·STEP, r·STEP; r растёт вверх), g — стартовое положение разрыва.
// Ссылка на точку: «A.SW» — конец подковы A в направлении SW, или id пятачка.
// pads — медные пятачки: какие точки касания они покрывают. socks — гнёзда по цветам: { b: ['A.NE', 'A.SE'], y: [...] }.
// locks — замки: подкова ring не крутится, пока не загорится пара color.
const LEVELS = [
  // LEVELS-BEGIN
  // 1. Щелчок: одна подкова, один тап — синий соединился с синим.
  { n: 1, name: 'Щелчок', rings: [{ id: 'A', c: 0, r: 0, g: 0 }], socks: { b: ['A.N', 'A.E'] } },
  // 2. Искра: жёлтая пара уже горит, её гнездо — на стыке. Тап по A (по часовой) суёт синий конец в жёлтое гнездо — искра.
  //    Против часовой (драг) — синие горят. После искры и отмены подсказка-стрелка показывает сторону.
  { n: 2, name: 'Искра', rings: [{ id: 'A', c: 0, r: 0, g: 0 }, { id: 'B', c: 1, r: 0, g: 7 }], socks: { b: ['A.W', 'A.N'], y: ['B.W', 'B.N'] } },
  // 3. Сначала убери: синяя B держит стык. Крутишь A кратчайшей стороной — искра; сначала отведи B со стыка (первое «ага»).
  { n: 3, name: 'Сначала убери', rings: [{ id: 'A', c: 0, r: 0, g: 2 }, { id: 'B', c: 1, r: 0, g: 5 }], socks: { b: ['B.E', 'B.S'], y: ['A.N', 'A.W'] } },
  // 4. Уголок: жёлтое гнездо на стыке A–C, жёлтой паре нужны две подковы. Синяя B ждёт, пока A уйдёт со стыка.
  { n: 4, name: 'Уголок', rings: [{ id: 'A', c: 0, r: 0, g: 1 }, { id: 'B', c: 1, r: 0, g: 6 }, { id: 'C', c: 0, r: 1, g: 1 }], socks: { b: ['B.N', 'B.E'], y: ['A.N', 'C.E'] } },
  // 5. Цепочка: жёлтая пара — через две подковы (B и C сцеплены на стыке). Синяя A у нижнего стыка: сначала B уходит, потом A, потом цепочка.
  { n: 5, name: 'Цепочка', rings: [{ id: 'A', c: 0, r: 0, g: 0 }, { id: 'B', c: 0, r: 1, g: 3 }, { id: 'C', c: 0, r: 2, g: 7 }], socks: { b: ['A.W', 'A.S'], y: ['C.W', 'B.E'] } },
  // 6. Перекрёсток: медный пятачок в центре касается всех четырёх. Через него может идти только один цвет.
  { n: 6, name: 'Перекрёсток', rings: [{ id: 'A', c: 0, r: 0, g: 7 }, { id: 'B', c: 1, r: 0, g: 6 }, { id: 'C', c: 0, r: 1, g: 3 }, { id: 'D', c: 1, r: 1, g: 5 }],
    pads: [{ id: 'x', tips: ['A.NE', 'B.NW', 'C.SE', 'D.SW'] }], socks: { b: ['C.NW', 'C.NE'], y: ['B.SW', 'D.NW'] } },
  // 7. Три цвета: зелёный, жёлтый и синий делят два стыка.
  { n: 7, name: 'Три цвета', rings: [{ id: 'A', c: 0, r: 0, g: 1 }, { id: 'B', c: 1, r: 0, g: 6 }, { id: 'C', c: 0, r: 1, g: 2 }, { id: 'D', c: 1, r: 1, g: 6 }],
    socks: { b: ['D.NW', 'D.NE'], y: ['B.N', 'B.E'], g: ['A.N', 'C.W'] } },
  // 8. Мастерская: пять подков, три цвета, синее гнездо на стыке C–D. Обход +2: подковы приходится уводить и возвращать.
  { n: 8, name: 'Мастерская', rings: [{ id: 'A', c: 0, r: 0, g: 1 }, { id: 'B', c: 1, r: 0, g: 1 }, { id: 'C', c: 0, r: 1, g: 3 }, { id: 'D', c: 1, r: 1, g: 6 }, { id: 'E', c: 1, r: 2, g: 0 }],
    socks: { b: ['C.E', 'A.W'], y: ['E.NE', 'E.SE'], g: ['B.E', 'D.E'] } },
  // LEVELS-END
];

// ---- геометрия ----
function gNorm(g){ return ((g % CFG.POS) + CFG.POS) % CFG.POS; }
function tipsOf(g){ g = gNorm(g); return [(g + 7) & 7, (g + 1) & 7]; }     // концы подковы: направления g−1 и g+1
function dirVec(k){ const a = k * Math.PI / 4; return { x: Math.sin(a), y: Math.cos(a) }; }
function ringCenter(r){ return { x: r.c * CFG.STEP, y: r.r * CFG.STEP }; }
function tipPos(r, k){ const c = ringCenter(r), d = dirVec(k); return { x: c.x + CFG.R * d.x, y: c.y + CFG.R * d.y }; }
function circDist(a, b){ const d = gNorm(b - a); return Math.min(d, CFG.POS - d); }

const COMPILED = new WeakMap();
function compile(L){
  let C = COMPILED.get(L); if (C) return C;
  const pts = [], key = new Map();
  const ptAt = (x, y) => {
    const k = Math.round(x / CFG.EPS) + ',' + Math.round(y / CFG.EPS);
    if (key.has(k)) return key.get(k);
    pts.push({ x, y, tips: [], pad: -1, sock: -1 }); key.set(k, pts.length - 1); return pts.length - 1;
  };
  const rid = new Map(L.rings.map((r, i) => [r.id, i]));
  const tipPt = L.rings.map((r, ri) => DIR.map((d, k) => { const p = tipPos(r, k), i = ptAt(p.x, p.y); pts[i].tips.push({ ri, k }); return i; }));

function find(p, i){ while (p[i] !== i){ p[i] = p[p[i]]; i = p[i]; } return i; }

// ---- сеть: искра, какие пары соединены ----
// kind: 'spark' (разные цвета в одной сети; mix — два гнезда разных цветов), 'win' (соединены все пары), 'open' (иначе; lit — какие пары горят).

// ---- состояние ----
function createState(li, def){

// ---- ход ----
function moveOf(ri, dir){ return ri * 2 + (dir > 0 ? 0 : 1); }

  n.g[ri] = gNorm(s.g[ri] + dir);

  const was = n.unl; n.unl = unlockFrom(n.C, n.res, n.unl);
  n.ev.push({ k: 'turn', ri, dir, g: n.g[ri] });
  if (n.unl !== was) for (let k = 0; k < n.C.n; k++) if ((n.unl & ~was) & (1 << k)) n.ev.push({ k: 'unlock', ri: k });

// ---- подробности сети для рендера и причин: какие подковы, пятачки и точки под током / в искре ----
// Граф точек: рёбра — подковы (по текущему g) и пятачки. Путь — поиск в ширину по точкам.
function pointGraph(C, g){
  const adj = C.pts.map(() => []);

}
// Ток соединённых пар: для каждого горящего цвета — от первого гнезда по сети. У подковы — шаг от гнезда, конец, с которого входит ток, и цвет;
// у гнезда — шаг, на котором ток дошёл до последнего гнезда пары (тогда пара загорается разом).

      if (!dist.has(a)) continue;

// Тусклый ток (v0.3.1): гнездо сразу красит свою сеть, ещё до того, как пара замкнулась, — видно, куда уже дошёл цвет.

// Где искра: подковы и точки на пути между гнёздами разных цветов (для почернения, искр и причины).
function faultInfo(C, g, res){

// ---- солвер: поиск в ширину по положениям подков; искра — тупик (дальше не идём) ----
function solve(s){

  const seen = new Map([[stateKey(start), null]]), q = [start];

      if (isWin(nx)){ const path = []; let at = k; while (seen.get(at)){ path.push(seen.get(at).move); at = seen.get(at).from; } return path.reverse(); }
      if (!isFail(nx)) q.push(nx);

// Полный граф уровня: достижимые состояния; good — откуда победа ещё достижима без искр.
const GRAPH = new WeakMap();

      node.next.push(k);

// Все положения подков (без замков): сколько побед, искр, прочих.

  for (let x = 0; x < total; x++){ let y = x; for (let i = 0; i < n; i++){ g[i] = y % 8; y = (y - g[i]) / 8; } evalCircuit(C, g, r); out[r.kind]++; }

// ---- проверка раскладки ----
function layoutErrors(L){
  const C = compile(L), out = C.errs.slice(), R = CFG.R;
  for (let i = 0; i < L.rings.length; i++) for (let k = i + 1; k < L.rings.length; k++){
    const a = ringCenter(L.rings[i]), b = ringCenter(L.rings[k]), d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 2 * R - 0.01) out.push('подковы ' + L.rings[i].id + ' и ' + L.rings[k].id + ' налезают (d=' + d.toFixed(2) + ')');
    if (L.rings[i].id === L.rings[k].id) out.push('два раза подкова ' + L.rings[i].id);
  }
  for (const r of L.rings) if (!(r.g >= 0 && r.g < CFG.POS)) out.push('подкова ' + r.id + ': положение ' + r.g);
  for (const ci of C.colors) if (C.colorSocks[ci].length < 2) out.push('цвет ' + COLORS[ci].name + ': одно гнездо — ему не с чем соединиться');
  if (!C.colors.length) out.push('нет гнёзд');
  for (const pd of (L.pads || [])) if (pd.tips.length < 2) out.push('пятачок ' + pd.id + ' касается одной точки — он ничего не соединяет');
  const s = createState(-1, L);
  if (isFail(s)) out.push('искра на старте');
  if (isWin(s)) out.push('все пары соединены на старте');
  return out;
}

// ---- боты (PROTO-BASE §6) ----
// Случайный — любой щелчок, пока не победа или искра.
function randomRun(li, seed, def){
  const rnd = mulberry32(seed); let s = createState(li, def);
  for (let k = 0; k < CFG.RANDOM_MOVES && !isWin(s) && !isFail(s); k++){ const m = legalMoves(s); if (!m.length) break; s = applyMove(s, m[Math.floor(rnd() * m.length)]); }
  return { win: isWin(s), fail: isFail(s), moves: s.moves };
}
// Тапальщик — только тапы (по часовой) по случайной подкове.
function tapRun(li, seed, def){
  const rnd = mulberry32(seed); let s = createState(li, def);
  for (let k = 0; k < CFG.RANDOM_MOVES && !isWin(s) && !isFail(s); k++){ const m = legalMoves(s).filter(x => !(x & 1)); if (!m.length) break; s = applyMove(s, m[Math.floor(rnd() * m.length)]); }
  return { win: isWin(s), fail: isFail(s), moves: s.moves };
}
// Жадный — «соединяю каждую пару, о чужих цветах не думаю». Ищет положение подков с наименьшим числом щелчков, где каждая пара
// в одной сети (смешение цветов его не волнует; при равенстве берёт победное), и крутит подковы по очереди (A, B, …)
// кратчайшей стороной (при равенстве — по часовой). Искра — попался.

  const n = C.n, total = Math.pow(CFG.POS, n), g = new Array(n).fill(0), p = C.par, r = {};
  let best = null, bc = Infinity, bw = false;
  for (let x = 0; x < total; x++){
    let y = x, cost = 0, ok = true;
    for (let i = 0; i < n; i++){ g[i] = y % 8; y = (y - g[i]) / 8; const d = circDist(g0[i], g[i]); if (d && C.lockColor[i] >= 0 && !(unl & (1 << i))){ ok = false; break; } cost += d; }
    if (!ok || cost > bc) continue;
    p.set(C.base);
    for (let ri = 0; ri < n; ri++){ const t = tipsOf(g[ri]); unite(p, C.tipPt[ri][t[0]], C.tipPt[ri][t[1]]); }
    let all = true;
    for (const ci of C.colors){ const ss = C.colorSocks[ci], r0 = find(p, C.socks[ss[0]].pt); for (let k = 1; k < ss.length; k++) if (find(p, C.socks[ss[k]].pt) !== r0){ all = false; break; } if (!all) break; }
    if (!all) continue;

  let s = createState(li, def); const path = [];
  for (let plan = 0; plan < 8 && !isWin(s) && !isFail(s); plan++){
    const tgt = naiveTarget(s.C, s.g, s.unl); if (!tgt) return { win: false, moves: s.moves, path, stuck: true };
    let moved = false;
    for (let ri = 0; ri < s.C.n && !isWin(s) && !isFail(s); ri++){
      if (ringLocked(s, ri)) continue;
      while (s.g[ri] !== tgt[ri] && !isFail(s) && !isWin(s)){
        const d = gNorm(tgt[ri] - s.g[ri]), m = moveOf(ri, d <= 4 ? 1 : -1);
        s = applyMove(s, m); path.push(m); moved = true;
      }
    }
    if (!moved) break;
  }
  return { win: isWin(s), fail: isFail(s), moves: s.moves, path, trappedAt: isFail(s) ? s.moves : -1, reason: isFail(s) ? failReason(s) : null };
}

const T0 = performance.now();
const T = { off: 0 };
const now = () => performance.now() + T.off;
function log(kind, name, info){          // журнал [game] — одна строка на событие (§11)
  console.log('[game] ' + JSON.stringify({ t: +((now() - T0) / 1000).toFixed(3), kind, name, info: info === undefined ? '' : String(info) }));
}
const PERF = {};
function mark(name){ PERF[name] = Math.round(performance.now() - T0); log('event', 'perf.' + name, PERF[name] + 'ms'); }
mark('script');

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
const Snd = {
  ac: null, out: null, noise: null, hum: null,
  init(){
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.out = this.ac.createGain(); this.out.gain.value = 0.8; this.out.connect(this.ac.destination);
      const len = this.ac.sampleRate, buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0), rnd = mulberry32(7);
      for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
      this.noise = buf;
    } catch (e) { this.ac = null; }
  },
  ok(){ return this.ac && !G.save.muted; },
  env(g, t, a, peak, dur){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); },
  osc(type, f0, f1, t, dur, peak, a){
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    this.env(g, t, a || 0.005, peak, dur); o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.03);
  },
  noiseBurst(t, dur, peak, type, freq, q){
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.noise; s.loop = true; s.loopStart = (t * 7.3) % 0.5; f.type = type; f.frequency.value = freq; f.Q.value = q || 0.7;
    this.env(g, t, 0.003, peak, dur); s.connect(f).connect(g).connect(this.out); s.start(t, (t * 13.7) % 0.8); s.stop(t + dur + 0.05);
    return { s, f, g };
  },
  ratchet(dir){ if (!this.ok()) return; const t = this.ac.currentTime;   // трещотка подковы: сухой тик, против часовой чуть ниже
    this.noiseBurst(t, 0.016, 0.22, 'highpass', 3800); this.osc('square', dir > 0 ? 2500 : 2150, 1500, t, 0.018, 0.045); this.osc('triangle', dir > 0 ? 560 : 500, 380, t + 0.004, 0.035, 0.07); log('sound', 'ratchet'); },
  contact(){ if (!this.ok()) return; const t = this.ac.currentTime;   // медь коснулась меди: короткий металлический «тинк»
    this.osc('sine', 3200, 2900, t, 0.06, 0.05); this.osc('triangle', 1400, 1300, t, 0.05, 0.04); log('sound', 'contact'); },
  off(){ if (!this.ok()) return; const t = this.ac.currentTime;       // пара погасла: глухое «пф» вниз
    const n = this.noiseBurst(t, 0.18, 0.14, 'lowpass', 1100); n.f.frequency.setValueAtTime(1100, t); n.f.frequency.exponentialRampToValueAtTime(180, t + 0.18);
    this.osc('sine', 380, 120, t, 0.18, 0.07); log('sound', 'off'); },
  humOn(level){ if (!this.ok()) return; const t = this.ac.currentTime;    // гул тока: 50 и 100 Гц через фильтр, держится, пока горит
    if (!this.hum){ const g = this.ac.createGain(), f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = 0.0001; f.connect(g).connect(this.out);
      const o1 = this.ac.createOscillator(), o2 = this.ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 100; o2.type = 'sine'; o2.frequency.value = 50; o1.connect(f); o2.connect(f); o1.start(); o2.start();
      this.hum = { g, o1, o2 }; }
    this.hum.g.gain.cancelScheduledValues(t); this.hum.g.gain.setTargetAtTime(0.035 * (level || 1), t, 0.15); log('sound', 'hum.on'); },
  humOff(){ if (!this.hum || !this.ac) return; const t = this.ac.currentTime; this.hum.g.gain.cancelScheduledValues(t); this.hum.g.gain.setTargetAtTime(0.0001, t, 0.08); },
  ding(k){ if (!this.ok()) return; const t = this.ac.currentTime, f = 1318 * Math.pow(2, (k || 0) * 4 / 12);   // «дзынь» лампочки: колокольчик
    [[1, 0.16, 1.6], [2.76, 0.05, 0.9], [5.4, 0.03, 0.5], [0.5, 0.06, 1.2]].forEach(([m, p, d]) => this.osc('sine', f * m, f * m, t, d, p, 0.003));
    this.noiseBurst(t, 0.05, 0.05, 'highpass', 6000); log('sound', 'ding'); },
  sparks(big){ if (!this.ok()) return; const t = this.ac.currentTime, rnd = mulberry32(Math.floor(t * 1000));   // треск искр: «бзз» и сухие щелчки
    this.osc('sawtooth', 1900, 140, t, 0.22, 0.13); this.noiseBurst(t, 0.12, 0.3, 'bandpass', 2600, 1.2); this.osc('sine', 120, 50, t, 0.25, 0.2);
    for (let k = 0; k < (big ? 26 : 14); k++){ const tt = t + 0.02 + rnd() * 0.75 * (k / 26 + 0.3); this.noiseBurst(tt, 0.008 + rnd() * 0.02, 0.12 + rnd() * 0.2, 'highpass', 2500 + rnd() * 4000); }
    this.noiseBurst(t + 0.25, 0.9, 0.05, 'lowpass', 700); log('sound', 'sparks'); },
  unlock(){ if (!this.ok()) return; const t = this.ac.currentTime; this.osc('square', 900, 600, t, 0.05, 0.05); this.osc('triangle', 1400, 1900, t + 0.06, 0.12, 0.08); log('sound', 'unlock'); },
  deny(){ if (!this.ok()) return; const t = this.ac.currentTime; this.noiseBurst(t, 0.12, 0.16, 'bandpass', 2200, 2); this.osc('square', 150, 130, t, 0.07, 0.06); this.osc('square', 150, 120, t + 0.1, 0.08, 0.06); log('sound', 'deny'); },
  win(){ if (!this.ok()) return; const t = this.ac.currentTime;   // праздник: «ух» снизу, арпеджио вверх, искристый шум, финальный аккорд
    this.osc('sine', 90, 180, t, 0.35, 0.18); this.noiseBurst(t + 0.05, 0.5, 0.06, 'highpass', 5000);
    [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => { this.osc('triangle', f, f, t + i * 0.07, 0.5, 0.08, 0.003); this.osc('sine', f * 2.76, f * 2.76, t + i * 0.07, 0.25, 0.02); });
    [1047, 1319, 1568].forEach(f => this.osc('sine', f, f, t + 0.48, 1.4, 0.07, 0.01)); log('sound', 'win'); },
  tick(){ if (!this.ok()) return; const t = this.ac.currentTime; this.osc('triangle', 900, 700, t, 0.04, 0.06); },
};
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// --- DOM, экраны (§6, §9, §11) ---
const $ = (id) => document.getElementById(id);
function goto(screen){
  G.screen = screen; log('screen', screen);
  const ov = $('overlay'), card = $('card');
  document.body.dataset.screen = screen;
  if (screen === 'game'){ ov.classList.remove('show'); return; }
  ov.classList.add('show');
  if (screen === 'menu'){
    const cur = Math.min(G.save.level, LEVELS.length - 1);
    card.innerHTML = `<h1 class="logo">Замкни <i>цепь</i></h1><p>Крути подковы — соедини гнёзда одного цвета.<br>Разные цвета встретятся — искра.</p>
      <button class="primary big" data-act="play">Играть · уровень ${cur + 1}</button>
      <div class="levels">${LEVELS.map((L, i) => `<button class="lv${G.save.done[i] ? ' done' : ''}${i === cur ? ' cur' : ''}" data-act="lv" data-i="${i}">${i + 1}</button>`).join('')}</div>
      <button data-act="help">Как играть</button>`;
  }
  if (screen === 'help') card.innerHTML = `<h2>Как играть</h2><ul class="rules">
      <li><b>Крути подкову пальцем</b> — щелчками в любую сторону. <b>Тап</b> — щелчок по часовой.</li>
      <li>Ток идёт по подкове от конца до конца и дальше — в то, чего коснулся конец: гнездо, соседнюю подкову, медный пятачок.</li>
      <li><b>Соедини гнёзда одного цвета</b> — плафоны загорятся. Цель — все пары. Пока пара не сошлась, цвет гнезда тускло бежит по подковам, до которых дотянулся.</li>
      <li><b>Искра:</b> разные цвета встретились в одной цепочке. Отмена бесплатна.</li>
      <li><b>Подержи палец</b> на подкове — видно, куда она встанет и что загорится. Отпустишь — она останется на месте.</li></ul>
      <button class="primary" data-act="menu">Понятно</button>`;
}
$('card').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act; Snd.init(); log('input', 'button', act); Snd.tick();
  if (act === 'play') startLevel(Math.min(G.save.level, LEVELS.length - 1));
  else if (act === 'lv') startLevel(+b.dataset.i);
  else if (act === 'help') goto('help');
  else goto('menu');
});
window.addEventListener('hashchange', () => routeHash());
function routeHash(){
  const h = location.hash.slice(1); if (!h) return false;
  const m = /^(?:level|l)(\d+)$/.exec(h);
  if (m){ startLevel(Math.max(0, Math.min(LEVELS.length - 1, +m[1] - 1))); return true; }
  if (h === 'game'){ startLevel(Math.min(G.save.level, LEVELS.length - 1)); return true; }
  if (h === 'win'){ startLevel(0); applyPath(solve(G.s) || [], true); return true; }               // эталон: решённый уровень 1
  if (h === 'fail'){ startLevel(2); applyPath(greedyRun(2).path, true); return true; }             // эталон: искра на уровне 3
  if (['menu', 'help'].includes(h)){ goto(h); return true; }
  return false;
}
let toastUntil = 0;
function toast(msg, ms){ const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); toastUntil = now() + (ms || 1700); }
function hud(){
  const L = G.s ? G.s.L : LEVELS[0];
  $('hud-level').textContent = (G.s ? G.s.li + 1 : 1) + ' · ' + L.name;
  $('hud-moves').textContent = '';   // Э-9: счётчика щелчков на экране нет (в журнале — level.win moves/par)

  $('hint').textContent = busy ? '' : (L.hint || '');

}
// Гнездо картинкой для плашек: цветной круг с белой формой (форма дублирует цвет, §9).
const SHAPE_SVG = { circle: '<circle cx="12" cy="12" r="4.6" fill="#fff"/>', tri: '<path d="M12 6.5l5.4 9.5H6.6z" fill="#fff"/>',

function hideBanners(){ $('dead').classList.remove('show'); $('won').classList.remove('show'); $('btn-undo').classList.remove('pulse'); }

function startLevel(li){
  G.s = createState(li); G.press = null; G.hint = null; G.pending = 0; G.won = 0; G.sparkAt = 0;
  hideBanners(); Snd.humOff(); G.celebrate = 0;
  G.shown = showState(G.s, now() - 10000);
  G.par = G.s.L.par !== undefined ? G.s.L.par : (solve(G.s) || []).length;     // большой уровень: par записан в уровне (проверяет sim)
  log('event', 'level.start', 'level=' + (li + 1) + ' par=' + G.par);
  if (R3) buildLevel(G.s.L);
  goto('game'); hud();
  if (li === 0 && !G.save.done[0]) setTimeout(() => { if (G.s && G.s.li === 0 && !G.s.moves) G.hint = { m: 0, until: now() + 4200 }; }, 900);
}
// Что показать для состояния: ток (если что-то горит) или повреждение. t0 — когда итог начал проигрываться.
function showState(s, t0, turned){
  const res = s.res, out = { res, g: s.g.slice(), t0, flow: null, fault: null, clash: null, nets: colorNets(s.C, s.g) };
  if (isFailKind(res.kind)){ out.fault = faultInfo(s.C, s.g, res); out.clash = clashOf(s, out.fault, turned === undefined ? -1 : turned); }
  else if (res.lit) out.flow = currentFlow(s.C, s.g, res);
  return out;
}
// Встреча токов перед искрой: по пути между гнёздами разных цветов каждый цвет бежит от своего гнезда к точке встречи.
// Точка встречи — ближний к гнезду второго цвета конец подковы, которую только что повернули (иначе середина пути).
function clashOf(s, f, turned){
  const path = f.path || [], n = path.length; if (!n) return null;
  let m = Math.round(n / 2); const k = path.findIndex(e => e.ri === turned); if (k >= 0) m = k + 1 > n - 1 ? k : k + 1;
  m = Math.max(1, Math.min(n - 1, m)); if (n === 1) m = 1;
  const rings = {};
  path.forEach((e, i) => { if (e.ri === undefined) return; const tips = tipsOf(s.g[e.ri]), A = i < m;
    const fromPt = A ? e.from : e.to, fromTip = tips.find(t => s.C.tipPt[e.ri][t] === fromPt);
    rings[e.ri] = { color: A ? f.colors[0] : f.colors[1], fromTip, step: A ? i : n - 1 - i, of: A ? m : n - m }; });
  const meet = path[m - 1] ? path[m - 1].to : path[0].from;
  return { rings, meet: s.C.pts[meet] };
}

// ===========================================================================
// 3D: рендерер, окружение, материалы. Процедурное — из именованных функций (§11), модели Tripo — файлами (assets/models).
// ===========================================================================
let R3 = null;
const GLB = {};
const MODEL_IDS = ['panel', 'lock'];

const SH_VERT = `
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec2 vUv;
void main(){
  vec4 w = modelMatrix * vec4(position, 1.0);
  vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz); vUv = uv;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
// Металлическая подкова: uv.x — вдоль дуги (0 у конца g−1, 1 у конца g+1). Ток цвета uGlow входит с конца uDir и бежит до uHead;
// за фронтом — бегущие импульсы света. uBurn — потемневшая от искры дуга. uGhost: 1 — превью тока (пунктир), 2 — превью искры (красный).
const SH_CORE = `
uniform vec3 uCopper; uniform vec3 uGlow; uniform vec3 uFault; uniform vec3 uLight;
uniform float uOn; uniform float uHead; uniform float uDir; uniform float uBurn; uniform float uTime; uniform float uGhost; uniform float uWin; uniform float uMix;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying vec2 vUv;
void main(){
  vec3 N = normalize(vN), L = normalize(uLight);
  float ndv = clamp(dot(N, vV), 0.0, 1.0), lam = 0.45 + 0.55 * clamp(dot(N, L), 0.0, 1.0);
  vec3 Rf = reflect(-vV, N);
  float env = smoothstep(-0.2, 0.9, Rf.y) * 0.5 + 0.15;
  vec3 c = uCopper * lam * (0.55 + 0.5 * ndv) + uCopper * env * 0.45 + vec3(1.0, 0.92, 0.8) * pow(max(dot(N, normalize(L + vV)), 0.0), 50.0) * 0.9;
  float u = uDir > 0.0 ? vUv.x : 1.0 - vUv.x;
  float lit = uOn * step(u, uHead);
  float run = 0.5 + 0.5 * sin(u * 26.0 - uTime * (9.0 + 9.0 * uWin));
  vec3 full = uGlow * (1.05 + 0.45 * run + 0.6 * uWin * pow(run, 4.0));
  // тусклый ток (uMix < 0.9): медь темнее, по ней медленно ползут бусины цвета гнезда — «цвет дошёл сюда», но пара не горит
  float bead = smoothstep(0.5, 0.95, 0.5 + 0.5 * sin(u * 19.0 - uTime * 2.4));
  vec3 weak = mix(c * 0.7, uGlow * 1.2, 0.12 + 0.88 * bead);
  float dimK = step(uMix, 0.9);

function buildLevel(L, noWarm){

    const arc = new THREE.Group(); arc.rotation.z = ARC0; rot.add(arc);
    const core = own(new THREE.Mesh(R3.geo.arc, coreMaterial())); core.renderOrder = 1; arc.add(core);

    }

    const shadow = new THREE.Mesh(R3.geo.disk, R3.mat.blob); shadow.scale.setScalar(1.22); shadow.position.set(0.06, -0.08, PZ + 0.012); rot.add(shadow);

      lockBadge = new THREE.Mesh(R3.geo.disk, R3.mat.rim[ci].clone()); lockBadge.userData.ownMat = true; lockBadge.scale.setScalar(0.13); lockBadge.position.set(0.24, -0.22, 0.5); g.add(lockBadge); }

    const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length, cy = pts.reduce((a, p) => a + p.y, 0) / pts.length, rad = Math.max(...pts.map(p => Math.hypot(p.x - cx, p.y - cy)));

    const halo = new THREE.Mesh(R3.geo.plane, R3.mat.halo.clone()); halo.userData.ownMat = true; halo.material.color = lin(VIEW.PAIR[ci].glow); halo.position.z = 0.55; halo.renderOrder = 8; halo.visible = false; g.add(halo);
    const pool = new THREE.Mesh(R3.geo.plane, R3.mat.pool.clone()); pool.userData.ownMat = true; pool.material.color = lin(VIEW.PAIR[ci].glow); pool.position.z = 0.02; pool.scale.setScalar(2.4); pool.visible = false; pool.renderOrder = 0; g.add(pool);

// Касается ли конец подковы ri (по положению g) чего-то: гнезда, пятачка или конца соседней подковы.

// Панель электрика (Tripo) во весь кадр: внешний край рамы чуть за краем экрана, видна внутренняя кромка рамы.

// Прогрев (lesson-threejs-first-draw-warmup): один раз нарисовать всё, что появится позже, потом вернуть как было.
function warmUp(){

// --- отображение: углы подков, ток, лампочки, повреждения ---
function updateRings(tNow){

  lv.rings.forEach((R, ri) => {
    let base = R.cont;
    if (R.anim){ const k = (tNow - R.anim.t0) / (R.anim.ms / ts); if (k >= 1) R.anim = null; else base = R.anim.from + (R.anim.to - R.anim.from) * (R.anim.back ? ease.back(Math.max(0, k)) : ease.out(Math.max(0, k))); }

        const nc = S.nets && S.nets.rings[ri] && S.nets.rings[ri].color >= 0 ? S.nets.rings[ri].color : -1; T.m.material.color.copy(nc >= 0 ? PAIR_GLOW[nc] : TIP_WHITE);

  const c0 = ringCenter(G.s.L.rings[ri]), rect = cv.getBoundingClientRect();
  const c = new THREE.Vector3(c0.x, c0.y, 0).project(R3.camera), e = new THREE.Vector3(c0.x + CFG.R, c0.y, 0).project(R3.camera);
  const x = (c.x + 1) / 2 * rect.width, y = (1 - c.y) / 2 * rect.height, ex = (e.x + 1) / 2 * rect.width;
  return { x, y, rpx: Math.abs(ex - x) };
}
function pickRing(cx, cy){
  if (!R3 || !R3.level || !G.s) return -1;
  const rect = cv.getBoundingClientRect(), x = cx - rect.left, y = cy - rect.top; let best = -1, bd = Infinity;
  G.s.L.rings.forEach((r, ri) => { const s = ringScreen(ri), d = Math.hypot(s.x - x, s.y - y) / s.rpx; if (d < VIEW.PICK_R && d < bd){ bd = d; best = ri; } });
  return best;
}
function pointerAngle(P, e){ const rect = cv.getBoundingClientRect(); return Math.atan2(e.clientY - rect.top - P.cy, e.clientX - rect.left - P.cx); }
cv.addEventListener('pointerdown', (e) => {
  Snd.init(); if (G.screen !== 'game' || !G.s || G.press) return;
  const ri = pickRing(e.clientX, e.clientY);
  if (ri < 0){ log('input', 'miss'); return; }
  if (isFail(G.s)){ log('input', 'press', 'fail'); Snd.deny(); toast('Сначала отмени ход — тут искра'); return; }
  if (isWin(G.s)) return;
  if (ringLocked(G.s, ri)){ log('input', 'press', 'ring=' + G.s.L.rings[ri].id + ' locked'); Snd.deny(); buzz(15); toast('Подкова на замке: соедини ' + COLORS[G.s.C.lockColor[ri]].ins.replace(/им$/, 'ие') + ' гнёзда'); R3.level.rings[ri].shake = now(); return; }
  const s = ringScreen(ri);
  G.press = { ri, id: e.pointerId, x: e.clientX, y: e.clientY, cx: s.x, cy: s.y, rpx: s.rpx, a: 0, acc: 0, drag: false, dir: 0, clicks: 0, t0: e.timeStamp || performance.now(), tp: performance.now() };
  G.press.a = pointerAngle(G.press, e);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  G.hint = null;
  log('input', 'press', 'ring=' + G.s.L.rings[ri].id);
});
cv.addEventListener('pointermove', (e) => {
  const P = G.press; if (!P || e.pointerId !== P.id) return;
  const rect = cv.getBoundingClientRect(), dx = e.clientX - rect.left - P.cx, dy = e.clientY - rect.top - P.cy;
  if (!P.drag && Math.hypot(e.clientX - P.x, e.clientY - P.y) > VIEW.TAP_PX){ P.drag = true; log('input', 'drag', 'ring=' + G.s.L.rings[P.ri].id); }
  const a = pointerAngle(P, e);
  if (Math.hypot(dx, dy) < P.rpx * 0.3){ P.a = a; return; }             // у центра угол пляшет — не крутим
  let d = a - P.a; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; P.a = a;
  if (!P.drag) return;
  P.acc += d;
  if (Math.abs(d) > 0.004) P.dir = d > 0 ? 1 : -1;
  while (Math.abs(P.acc) >= STEP * 0.5){
    const dir = P.acc > 0 ? 1 : -1;
    if (G.pending) resolvePending();
    if (isFail(G.s) || isWin(G.s)){ P.acc = 0; break; }
    P.acc -= dir * STEP; P.clicks++;
    if (!turnRing(P.ri, dir, 'drag')) { P.acc = 0; break; }
  }
});
function onUp(e){
  const P = G.press; if (!P || e.pointerId !== P.id) return;
  G.press = null;
  const R = R3 && R3.level && R3.level.rings[P.ri];
  if (R && P.drag){ R.anim = { from: R.vis, to: R.cont, t0: now(), ms: 140, back: false }; }
  if (e.type === 'pointercancel') return;
  if (P.drag || P.clicks) return;
  // Э-1: держал дольше HOLD_MS — смотрел превью, отпускание хода не делает. Короче — тап, сколько бы ни длился (без мёртвой зоны).
  // Граница — по времени самих событий касания, а не по кадру (lesson-tap-hold-gap).
  const held = (e.timeStamp || performance.now()) - P.t0;
  if (held >= VIEW.HOLD_MS){ log('input', 'look', 'ring=' + G.s.L.rings[P.ri].id + ' ms=' + Math.round(held)); return; }
  turnRing(P.ri, 1, 'tap');
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {            // дубли на клавиатуру (§3): цифра — по часовой, Shift+цифра — против
  const mm = /^Digit([1-9])$/.exec(e.code);
  if (mm && G.s){ if (G.pending) resolvePending(); turnRing(+mm[1] - 1, e.shiftKey ? -1 : 1, 'key'); }
  if (e.key === 'z' || e.key === 'u') undo(); if (e.key === 'r' && G.s) startLevel(G.s.li); if (e.key === 'm') goto('menu'); if (e.key === 'h') showHint();
  if (e.key === 'n' && G.s && isWin(G.s)) nextLevel();
});
function nextLevel(){ const li = G.s ? G.s.li + 1 : 0; if (li >= LEVELS.length) goto('menu'); else startLevel(li); }
$('btn-undo').onclick = () => { Snd.init(); log('input', 'button', 'undo'); undo(); };
$('btn-reset').onclick = () => { Snd.init(); log('input', 'button', 'reset'); if (G.s) startLevel(G.s.li); };
$('btn-hint').onclick = () => { Snd.init(); log('input', 'button', 'hint'); if (G.s && !G.pending) showHint(); };
$('btn-menu').onclick = () => { Snd.init(); log('input', 'button', 'menu'); Snd.humOff(); goto('menu'); };
$('btn-mute').onclick = () => { Snd.init(); G.save.muted = !G.save.muted; save(); hud(); if (G.save.muted) Snd.humOff(); log('input', 'button', 'mute=' + G.save.muted); };
$('dead-undo').onclick = () => { Snd.init(); log('input', 'button', 'dead.undo'); undo(); };
$('won-next').onclick = () => { Snd.init(); log('input', 'button', 'won.next'); Snd.humOff(); nextLevel(); };

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
let lastW = 0, lastH = 0;
function fit(){
  if (!R3) return;
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  if (r.width === lastW && r.height === lastH) return; lastW = r.width; lastH = r.height;
  R3.renderer.setPixelRatio(R3.dpr); R3.renderer.setSize(r.width, r.height, false);
  R3.camera.aspect = r.width / r.height; frameCamera(); fitPanel();
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); if (G.paused) Snd.humOff(); else if (G.s && G.s.res.lit && !isFail(G.s)) Snd.humOn(0.6); });

// --- кадр ---
function renderFrame(){
  if (!R3) return;
  const tNow = now(), t0 = performance.now();
  if (G.pending && tNow >= G.pending) resolvePending();
  if (R3.level && G.shown){
    syncView(tNow);
    updateParts(tNow);
    const F = window.ZAMKNI_TSEP && window.ZAMKNI_TSEP.flags;
    if (F && F.noParts){ R3.sparks.count = 0; R3.smoke.count = 0; R3.glints.count = 0; }
  }
  R3.renderer.render(R3.scene, R3.camera);
  const dt = performance.now() - t0;
  R3.frames.push(dt); if (R3.frames.length > 240) R3.frames.shift();
  if (G.celebrate && tNow >= G.celebrate) celebrate();
  if (G.sparkAt && tNow >= G.sparkAt) spark();
  if (G.won && tNow >= G.won) showWon();
  if (toastUntil && tNow > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}
let lastFrame = 0;
function spinning(){ const lv = R3 && R3.level; return !!(lv && (G.spinDemo || (G.press && G.press.drag) || lv.rings.some(R => R.anim))); }
function animating(){ const S = G.shown; return !!(G.pending || (S && now() - S.t0 < CFG.FLOW_MS * 1.2 / G.timeScale) || (R3 && R3.parts.length)); }
function frame(){
  const t = performance.now();
  if (G.bench && lastFrame){ if (spinning()) G.bench.spin.push(t - lastFrame); else if (animating()) G.bench.fx.push(t - lastFrame); }
  lastFrame = t; if (!G.paused) renderFrame(); requestAnimationFrame(frame);
}
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) renderFrame(); }, 40);   // rAF + сторож: безопасно, время абсолютное (§4)

// --- дебаг-хук (§6) ---
const waitFrames = () => new Promise(res => requestAnimationFrame(res));
function benchStats(ints){
  ints = ints.slice().sort((a, b) => a - b); const avg = ints.reduce((a, b) => a + b, 0) / Math.max(1, ints.length);
  return { frames: ints.length, fps: +(1000 / Math.max(1e-6, avg)).toFixed(1), p95ms: +(ints[Math.floor(ints.length * 0.95)] || 0).toFixed(1), long: ints.filter(x => x > 25).length };
}
window.ZAMKNI_TSEP = {
  G, LEVELS, PERF,
  state(){ return G.s ? { level: G.s.li + 1, name: G.s.L.name, g: G.s.g.join(''), kind: G.s.res.kind, lit: G.s.res.lit, unl: G.s.unl, moves: G.s.moves, par: G.par,
    win: isWin(G.s), fail: isFail(G.s), reason: failReason(G.s), pending: !!G.pending, screen: G.screen,
    banner: $('dead').classList.contains('show') ? 'dead' : $('won').classList.contains('show') ? 'won' : '' } : { screen: G.screen }; },
  play(n){ startLevel(Math.max(0, Math.min(LEVELS.length, n || 1) - 1)); return this.state(); },
  turn(ri, dir){ if (G.pending) resolvePending(); turnRing(ri, dir || 1, 'key'); return this.state(); },
  tap(ri){ if (G.pending) resolvePending(); turnRing(ri, 1, 'tap'); return this.state(); },
  press(ri, dir){ G.press = { ri, id: -1, x: 0, y: 0, cx: 0, cy: 0, rpx: 1, a: 0, acc: 0, drag: false, dir: dir || 0, clicks: 0, t0: 0, tp: -1e9 }; const n = previewMoveState(G.s, moveOf(ri, dir || 1)); return n ? { kind: n.res.kind, lit: n.res.lit } : null; },
  release(){ const P = G.press; G.press = null; return P ? turnRing(P.ri, P.dir || 1, 'tap') : false; },
  undo(){ undo(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  solve(){ return G.s ? solve(G.s) : null; },
  hint(){ showHint(); return G.hint; },
  auto(delayMs){ const path = this.solve() || []; path.forEach((m, k) => setTimeout(() => { if (G.pending) resolvePending(); turnRing(m >> 1, (m & 1) ? -1 : 1, 'auto'); }, (delayMs || 900) * k)); return path; },
  greedy(){ return G.s ? greedyRun(G.s.li).path : []; },
  drive(sec, stepMs){                         // ручной прогон времени: rAF заморожен в скрытой вкладке/превью
    const step = stepMs || 1000 / 60, n = Math.round(sec * 1000 / step);
    for (let i = 0; i < n; i++){ T.off += step; renderFrame(); }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  rings(){ return G.s ? G.s.L.rings.map((r, ri) => ({ ri, id: r.id, g: G.s.g[ri], locked: ringLocked(G.s, ri), screen: R3 && R3.level ? ringScreen(ri) : null })) : []; },
  async bench(rounds){                        // замер кадра: решение текущего уровня на реальном rAF; эффекты и кручение отдельно
    rounds = rounds || 2; const li = G.s ? G.s.li : 6, cpu = []; G.bench = { fx: [], spin: [] };
    for (let r = 0; r < rounds; r++){
      startLevel(li); await new Promise(res => setTimeout(res, 300));
      const path = solve(G.s) || [];
      for (const m of path){
        R3.frames.length = 0; if (G.pending) resolvePending(); turnRing(m >> 1, (m & 1) ? -1 : 1, 'auto');
        while (spinning() || G.pending) await waitFrames();
        cpu.push(...R3.frames);
      }
      for (const t0 = performance.now(); performance.now() - t0 < 1600;) await waitFrames();
      startLevel(2); applyPath(greedyRun(2).path); for (const t0 = performance.now(); performance.now() - t0 < 1500;) await waitFrames();
    }
    startLevel(li);
    G.spinDemo = now(); for (const t0 = performance.now(); performance.now() - t0 < 2000;) await waitFrames(); G.spinDemo = 0;
    const B = G.bench; G.bench = null; cpu.sort((a, b) => a - b);
    const out = { fx: benchStats(B.fx), spin: benchStats(B.spin), cpuAvgMs: +(cpu.reduce((a, b) => a + b, 0) / Math.max(1, cpu.length)).toFixed(2),
      cpuP95ms: +(cpu[Math.floor(cpu.length * 0.95)] || 0).toFixed(2), dpr: R3.dpr, size: R3.renderer.domElement.width + '×' + R3.renderer.domElement.height };
    log('event', 'bench', JSON.stringify(out)); return out;
  },
  startup(){ return PERF; },
  get R3(){ return R3; },
  flags: {},
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт: меню сразу (DOM), GL и модели — следом; холст проявляется, когда шейдеры собраны и прогреты ---
hud();
const routed = routeHash();
if (!routed) goto('menu');
mark('menu');
(async function boot(){
  try {
    await new Promise(r => setTimeout(r, 0));
    initRenderer();
    lastW = 0; fit();
    await Promise.race([loadModels(), new Promise(r => setTimeout(r, 6000))]);
    if (!G.s){ G.s = createState(Math.min(G.save.level, LEVELS.length - 1)); G.shown = showState(G.s, now() - 10000); G.par = G.s.L.par !== undefined ? G.s.L.par : (solve(G.s) || []).length; }
    buildLevel(G.s.L, true); mark('level');
    if (R3.renderer.compileAsync) await R3.renderer.compileAsync(R3.scene, R3.camera); mark('compile');
    warmUp(); renderFrame(); mark('firstFrame');
    $('gl').classList.add('ready'); hud();
    requestAnimationFrame(frame);
    log('event', 'boot', 'levels=' + LEVELS.length + ' glb=' + Object.keys(GLB).join(','));
  } catch (err) { console.error(err); log('event', 'boot.fail', err.message); toast('3D не запустился: ' + err.message, 6000); }
})();
}
</script>
